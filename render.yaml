# Optional Render Blueprint for a new production service. This creates paid compute
# and a persistent disk because the CRM stores client data in SQLite.
services:
  - type: web
    name: mf-sarthi
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /api/health
    disk:
      name: crm-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: HOLDINGS_DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: SITE_ADMIN_EMAILS
        sync: false
      - key: PORTFOLIO_SOURCE_MAX_MB
        value: 40
