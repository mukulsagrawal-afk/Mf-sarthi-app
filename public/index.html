function fxWireSearch(input, dd, selected) {
  let timer, sequence = 0, results = [], activeIndex = -1;
  dd.id = 'scheme-list-' + (input.dataset.fxScheme || 'replacement-' + input.dataset.fxReplacement);
  dd.setAttribute('role','listbox');
  dd.setAttribute('aria-label','Matching mutual fund schemes');
  input.setAttribute('role','combobox');
  input.setAttribute('aria-autocomplete','list');
  input.setAttribute('aria-controls',dd.id);
  input.setAttribute('aria-expanded','false');
  function show() { dd.classList.add('open'); input.setAttribute('aria-expanded','true'); }
  function hide() { dd.classList.remove('open'); input.setAttribute('aria-expanded','false'); input.removeAttribute('aria-activedescendant'); activeIndex = -1; }
  function activate(index) {
    activeIndex = index;
    dd.querySelectorAll('[data-fx-result]').forEach((item,i) => {
      item.classList.toggle('active',i === index);
      item.setAttribute('aria-selected',i === index ? 'true' : 'false');
      if (i === index) { input.setAttribute('aria-activedescendant',item.id); item.scrollIntoView({block:'nearest'}); }
    });
  }
  input.onkeydown = function(e) {
    if (e.key === 'Escape') { hide(); return; }
    if (!dd.classList.contains('open') || !results.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); activate(activeIndex < 0 ? (e.key === 'ArrowDown' ? 0 : results.length - 1) : (activeIndex + (e.key === 'ArrowDown' ? 1 : -1) + results.length) % results.length);
    } else if (e.key === 'Enter' && activeIndex >= 0) {
      e.preventDefault(); const choice = results[activeIndex]; hide(); selected(choice);
    }
  };
  input.oninput = function() {
    const q = input.value.trim();
    clearTimeout(timer);
    const request = ++sequence;
    results = []; activeIndex = -1; input.removeAttribute('aria-activedescendant');
    if (q.length < 2) { hide(); return; }
    dd.innerHTML = '<div class="pdd-empty" role="status"><span class="pdd-spinner" aria-hidden="true"></span>Searching schemes...</div>';
    show();
    timer = setTimeout(async function() {
      try {
        const response = await api('/mf/search?q=' + encodeURIComponent(q));
        if (request !== sequence || !document.body.contains(input)) return;
        results = response.results || [];
        dd.innerHTML = results.length ? '<div class="pdd-heading" role="presentation">Matching schemes · ' + results.length + '</div>' + results.map(function(s,i){
          const name = String(s.schemeName || '');
          const plan = /\bdirect\b/i.test(name) ? 'Direct' : /\bregular\b/i.test(name) ? 'Regular' : '';
          const option = /\bidcw\b|dividend/i.test(name) ? 'IDCW' : /\bgrowth\b/i.test(name) ? 'Growth' : '';
          const detail = [plan,option].filter(Boolean).join(' · ') || 'Mutual fund scheme';
          return '<button type="button" role="option" aria-selected="false" id="' + dd.id + '-option-' + i + '" class="pdd-item" data-fx-result="' + i + '" style="--item-delay:' + Math.min(i,6) * 22 + 'ms"><span class="pdd-icon" aria-hidden="true">↗</span><span class="pdd-copy">' + esc(name) + '<span class="pdd-meta">' + detail + '</span></span><span class="pdd-arrow" aria-hidden="true">→</span></button>';
        }).join('') + '<div class="pdd-footer" role="presentation">↑ ↓ to navigate · Enter to select</div>' : '<div class="pdd-empty" role="status">No matching schemes. Try a more specific fund name.</div>';
        dd.querySelectorAll('[data-fx-result]').forEach(function(item){
          item.onclick = function(){ hide(); selected(results[Number(item.dataset.fxResult)]); };
        });
      } catch(e) {
        if (request === sequence) dd.innerHTML = '<div class="pdd-empty" role="status">Could not search schemes. Try again.</div>';
      }
    }, 320);
  };
  input.onblur = function(){ setTimeout(hide,180); };
}
async function fxLoadPreview(code) {

}
function fxWireStep(root) {

  };

    get('fxExisting').onclick = function(){ fxMode = 'existing'; fxClientId = ''; fxClient = {name:'',age:'',riskProfile:'',horizonYears:''}; renderFolioXpert(); };
    get('fxManual').onclick = function(){ fxMode = 'manual'; fxClientId = ''; fxClient = {name:'',age:'',riskProfile:'',horizonYears:''}; renderFolioXpert(); };

      fxError = ''; renderFolioXpert();

      if (file.size > 15 * 1024 * 1024) { fxSetError('The PDF must be 15 MB or smaller.'); return; }
      const form = new FormData(); form.append('file', file);
      if (get('fxCasPassword').value) form.append('password', get('fxCasPassword').value);
      fxBusy = true; get('fxCasUpload').disabled = true; get('fxCasUpload').textContent = 'Reading statement...';
      try {

        fxCasWarnings = result.warnings || [];
        fxError = '';
      } catch(e) { fxError = e.message || 'Could not read this statement.'; }
      fxBusy = false; renderFolioXpert();
    };
    root.querySelectorAll('[data-fx-cas-use]').forEach(input => input.onchange = function(){ fxCasCandidates[Number(this.dataset.fxCasUse)].include = this.checked; });
    root.querySelectorAll('[data-fx-cas-select]').forEach(select => select.onchange = function(){
      const c = fxCasCandidates[Number(this.dataset.fxCasSelect)];
      c.chosen = (c.suggestions || []).find(s => Number(s.schemeCode) === Number(this.value)) || null;
      c.include = !!c.chosen;

    });
    if (get('fxImportSelected')) get('fxImportSelected').onclick = function(){
      const selected = fxCasCandidates.filter(c => c.include);
      if (selected.some(c => !c.chosen)) { fxSetError('Choose the exact scheme and plan for every included row.'); return; }
      const existing = new Set(fxHoldings.filter(h => h.scheme).map(h => Number(h.scheme.schemeCode)));
      const unique = [];
      selected.forEach(c => { const code = Number(c.chosen.schemeCode); if (!existing.has(code)) { existing.add(code); unique.push(c); } });
      const occupied = fxHoldings.filter(h => h.scheme);

      if (!fxHoldings.length) fxHoldings = [{scheme:null,currentValue:''}];

      unique.forEach(c => fxLoadPreview(Number(c.chosen.schemeCode)));
    };
    get('fxAddHolding').onclick = function(){ if (fxHoldings.length < 12) { fxHoldings.push({scheme:null,currentValue:''}); renderFolioXpert(); } };
    root.querySelectorAll('[data-fx-value]').forEach(function(input){
      input.oninput = function(){ fxHoldings[Number(this.dataset.fxValue)].currentValue = this.value; };

      btn.onclick = function(){ fxHoldings.splice(Number(this.dataset.fxRemoveHolding),1); if (!fxHoldings.length) fxHoldings.push({scheme:null,currentValue:''}); fxError = ''; renderFolioXpert(); };
    });

    get('fxEdit').onclick = function(){fxStep = 0; fxError = ''; renderFolioXpert();};
    get('fxEditHoldings').onclick = function(){fxStep = 2; fxError = ''; renderFolioXpert();};

    });
    get('fxCompare').onclick = function(){ fxRunReport(true); };
  }
}
async function fxRunReport(withReplacements) {
  if (fxBusy) return;
  const oldStep = fxStep;
  for (let i = 0; i < 3; i++) {
    fxStep = i;
    const error = fxValidStep();
    if (error) { fxSetError(error); return; }
  }
  fxStep = oldStep;
  const replacements = {};
  if (withReplacements) Object.keys(fxReplacements).forEach(function(code){ replacements[code] = fxReplacements[code].schemeCode; });
  fxBusy = true; fxError = ''; renderFolioXpert();
  try {
    fxReport = await api('/folioxpert/report', {method:'POST', body:{
      client:fxClientPayload(), goals:fxGoalPayload(), holdings:fxHoldingPayload(), proposedReplacements:replacements
    }});
    fxStep = 3;
  } catch(e) { fxError = e.message || 'Could not build the report.'; }
  fxBusy = false; renderFolioXpert();
}

function fxCoverageText(m) {

    <div class="card card-pad" style="max-width:560px;margin-bottom:20px">
      <div class="form-grid">
        <div class="form-field"><label>Full Name</label><input value="${esc(currentUser?.name||'')}" disabled></div>
        <div class="form-field full"><label>Email</label><input value="${esc(currentUser?.email||'')}" disabled></div>
      </div>
      <div style="margin-top:16px;display:flex;gap:10px">
        <button class="btn" id="logoutBtn"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg>Log Out</button>
      </div>
    </div>

    <div class="card card-pad" style="max-width:560px;margin-bottom:20px">
      <div class="section-title" style="margin-bottom:4px">Import Monthly Statement</div>
      <div class="sub" style="color:var(--text-muted);font-size:12.5px;margin-bottom:12px">
        Upload a CSV or Excel export from CAMS/KFintech/your back-office (columns like Name, Mobile, PAN, AUM, SIP Amount).
        Matching clients are updated by PAN or mobile; unmatched rows create new client records.
      </div>
      <input type="file" id="statementFile" accept=".csv,.xlsx,.xlsm" style="margin-bottom:10px">
      <div><button class="btn btn-primary btn-sm" id="importStatementBtn"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>Import Statement</button></div>
      <div id="importResult" style="margin-top:10px;font-size:12.5px;color:var(--text-muted)"></div>
    </div>

    <div class="card card-pad" style="max-width:560px;margin-bottom:20px">
      <div class="section-title" style="margin-bottom:4px">Reminders</div>
      <div class="sub" style="color:var(--text-muted);font-size:12.5px;margin-bottom:12px">
        A digest of today's meetings and due follow-ups is emailed to you automatically every morning.
        Use this to send it right now instead of waiting.
      </div>
      <button class="btn btn-sm" id="sendReminderBtn"><svg viewBox="0 0 24 24"><use href="#i-mail"/></svg>Send My Reminders Now</button>
      <div id="reminderResult" style="margin-top:10px;font-size:12.5px;color:var(--text-muted)"></div>
    </div>

    <div class="card card-pad" style="max-width:560px">
      <div class="section-title" style="margin-bottom:4px">Export Data</div>
      <div class="sub" style="color:var(--text-muted);font-size:12.5px;margin-bottom:12px">Download your book as a spreadsheet-ready CSV file.</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn btn-sm" href="/api/export/clients.csv"><svg viewBox="0 0 24 24"><use href="#i-report"/></svg>Clients CSV</a>
        <a class="btn btn-sm" href="/api/export/portfolio.csv"><svg viewBox="0 0 24 24"><use href="#i-report"/></svg>Portfolio CSV</a>
        <a class="btn btn-sm" href="/api/export/leads.csv"><svg viewBox="0 0 24 24"><use href="#i-report"/></svg>Leads CSV</a>
      </div>
    </div>
  `;
  document.getElementById('logoutBtn').onclick = logout;
  document.getElementById('sendReminderBtn').onclick = async ()=>{
    const resultEl = document.getElementById('reminderResult');
    resultEl.textContent = 'Sending…';
    try{
      const data = await api('/reminders/run-now', {method:'POST'});
      const s = data.sent;
      resultEl.textContent = s.message
        ? s.message + ' (mode: ' + data.emailMode + ')'
        : `Sent - ${s.followups} follow-up(s), ${s.meetings} meeting(s). Mode: ${data.emailMode}`;
      toast('Reminder digest sent','i-check');
    }catch(err){ resultEl.textContent = 'Failed: '+err.message; }
  };
  document.getElementById('importStatementBtn').onclick = async ()=>{
    const fileInput = document.getElementById('statementFile');
    const resultEl = document.getElementById('importResult');
    if(!fileInput.files.length){ toast('Choose a file first'); return; }
    const fd = new FormData(); fd.append('file', fileInput.files[0]);
    resultEl.textContent = 'Importing…';
    try{
      const data = await api('/statements/import', { method:'POST', body: fd });
      resultEl.textContent = `Done - ${data.summary.matched} client(s) updated, ${data.summary.created} new client(s) created, ${data.summary.failed} row(s) failed, out of ${data.summary.total} row(s).`;
      toast('Statement imported','i-check');
      await loadData(); renderCrm(); renderDashboard();
    }catch(err){
      resultEl.textContent = 'Import failed: '+err.message;
    }
  };
}
function renderHelp(){
  const el = document.getElementById('view-help');
  el.innerHTML = `
    <div class="page-head"><div><h1>Help &amp; Support</h1><div class="sub">This is a first prototype - feedback shapes what gets built next.</div></div></div>
    <div class="card card-pad" style="max-width:560px">
      <div class="form-field full" style="margin-bottom:12px"><label>Send Feedback</label><textarea placeholder="What worked? What would make this more useful in a real client meeting?"></textarea></div>
      <button class="btn btn-primary" id="sendFeedbackBtn"><svg viewBox="0 0 24 24"><use href="#i-check"/></svg>Send Feedback</button>
    </div>
  `;
  document.getElementById('sendFeedbackBtn').onclick = ()=>toast('Thanks - feedback noted','i-check');
}
</script>

<script>
/* ============================================================
   GLOBAL SEARCH
   ============================================================ */
const SEARCHABLE_CALCS = [{id:'sip',t:'SIP Calculator'},{id:'goal',t:'Goal Planner'},{id:'lumpsum',t:'Lumpsum Calculator'},{id:'swp',t:'SWP Calculator'}];
function runGlobalSearch(q){
  q = q.trim().toLowerCase();
  const box = document.getElementById('searchResults');
  if(!q){ box.classList.remove('open'); box.innerHTML=''; return; }
  const groups = [];
  const clientHits = allContacts().filter(c=>c.name.toLowerCase().includes(q)).slice(0,5);
  if(clientHits.length) groups.push({label:'Clients & Leads', items:clientHits.map(c=>({t:c.name, s:c.type==='client'?'Client':'Lead', action:()=>{closeSearch(); openClientDrawer(c.id);}}))});
  const meetingHits = meetings.filter(m=>m.clientName.toLowerCase().includes(q) || m.type.toLowerCase().includes(q)).slice(0,4);
  if(meetingHits.length) groups.push({label:'Meetings', items:meetingHits.map(m=>({t:m.clientName+' - '+m.type, s:fmtDateShort(m.date), action:()=>{closeSearch(); switchView('meetings');}}))});
  const artHits = articles.filter(a=>a.t.en.title.toLowerCase().includes(q) || a.cat.toLowerCase().includes(q)).slice(0,4);
  if(artHits.length) groups.push({label:'Knowledge Hub', items:artHits.map(a=>({t:a.t.en.title, s:a.cat, action:()=>{closeSearch(); kbActiveArticle=a.id; kbLang='en'; switchView('knowledge');}}))});
  const calcHits = SEARCHABLE_CALCS.filter(c=>c.t.toLowerCase().includes(q));
  if(calcHits.length) groups.push({label:'Calculators', items:calcHits.map(c=>({t:c.t, s:'Calculator', action:()=>{closeSearch(); calcMode = c.id==='goal'?'goal':'sip'; switchView('calculators');}}))});
  if(!groups.length){ box.innerHTML = `<div style="padding:16px">${emptyState('i-search','No results for "'+esc(q)+'"','Try searching a client name, meeting type or article topic.')}</div>`; box.classList.add('open'); return; }
  box.innerHTML = groups.map(g=>`<div class="sr-group-label">${g.label}</div>${g.items.map((it,i)=>`<div class="sr-item" data-g="${g.label}" data-i="${i}"><span class="t">${esc(it.t)}</span><span class="s">${esc(it.s)}</span></div>`).join('')}`).join('');
  box.classList.add('open');
  let idx=0;
  groups.forEach(g=>g.items.forEach(it=>{
    const node = box.querySelectorAll('.sr-item')[idx]; idx++;
    node.addEventListener('click', it.action);
  }));
}
function closeSearch(){ document.getElementById('searchResults').classList.remove('open'); document.getElementById('globalSearch').value=''; }

/* ============================================================
   NOTIFICATIONS
   ============================================================ */
function renderNotifications(){
  const dd = document.getElementById('notifDD');
  const dueToday = followups.filter(f=>sameDay(f.due,TODAY)).length;
  const overdue = followups.filter(f=>f.due<TODAY).length;
  const tomorrowReviews = clients.filter(c=>c.nextReview && sameDay(c.nextReview,addDays(TODAY,1))).length;
  const items = [
    {ico:'i-bell', t:`${dueToday} follow-ups due today`, when:'Today'},
    {ico:'i-cal', t:`${tomorrowReviews} client reviews tomorrow`, when:'Tomorrow'},
    {ico:'i-alert', t:`${overdue} overdue follow-up${overdue===1?'':'s'}`, when:'Needs attention'},
    {ico:'i-plus', t:`New lead added - ${leads[0]?leads[0].name:'-'}`, when:'2 hours ago'},
    {ico:'i-report', t:'Report generated for Rajesh Shah', when:'Yesterday'},
  ];
  dd.innerHTML = `<div class="hd">Notifications</div>${items.map(it=>`
    <div class="notif-item"><div class="ico"><svg><use href="#${it.ico}"/></svg></div><div class="txt"><b>${it.t}</b><div class="when">${it.when}</div></div></div>`).join('')}`;
}

/* ============================================================
   ROUTER
   ============================================================ */
const VIEW_RENDERERS = {
  dashboard: renderDashboard, crm: renderCrm, meetings: renderMeetings, calculators: renderCalculators,
  knowledge: renderKnowledge, folioxpert: renderFolioXpert, insights: renderInsights, reports: renderReportsList, settings: renderSettings, help: renderHelp
};
function switchView(name, resetState){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const target = document.getElementById('view-'+name);
  if(target) target.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.getAttribute('data-view')===name));
  if(resetState){
    if(name==='crm'){ crmFilter='All'; crmSearch=''; }
    if(name==='knowledge'){ kbActiveArticle=null; }
    if(name==='calculators'){ calcMode='landing'; }
  }
  (VIEW_RENDERERS[name]||function(){})();
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0,0);
}

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', function(){ checkSessionAndBoot(); });

function startApp(){
  document.getElementById('topbarDate').textContent = new Date().toLocaleDateString('en-IN',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
  document.getElementById('nav-leads-badge').textContent = leads.length;
  document.getElementById('nav-overdue-badge').textContent = overdueMeetingsCount()+followups.filter(f=>f.due<TODAY).length;

  document.querySelectorAll('.nav-item[data-view]').forEach(item=>{
    item.addEventListener('click', ()=>switchView(item.getAttribute('data-view'), true));
  });
  document.querySelectorAll('.user-chip[data-view]').forEach(item=>{
    item.addEventListener('click', ()=>switchView(item.getAttribute('data-view'), true));
  });

  document.getElementById('menuToggle').addEventListener('click', ()=>document.getElementById('sidebar').classList.toggle('open'));
  document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });

  const searchInput = document.getElementById('globalSearch');
  searchInput.addEventListener('input', (e)=>runGlobalSearch(e.target.value));
  document.addEventListener('click', (e)=>{ if(!e.target.closest('.topbar-search')) document.getElementById('searchResults').classList.remove('open'); });

  const notifBtn = document.getElementById('notifBtn');
  const notifDD = document.getElementById('notifDD');
  renderNotifications();
  notifBtn.addEventListener('click', (e)=>{ e.stopPropagation(); notifDD.classList.toggle('open'); });
  document.addEventListener('click', (e)=>{ if(!e.target.closest('#notifBtn') && !e.target.closest('#notifDD')) notifDD.classList.remove('open'); });

  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape'){ closeModal(); closeDrawer(); document.getElementById('reportOverlay').classList.remove('open'); }
  });

  switchView('dashboard');
}
</script>

</body>
</html>
