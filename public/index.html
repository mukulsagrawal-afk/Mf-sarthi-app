function demoFolioReport(body) {
  const warnings = ['Demo report: fund figures are sample data. Do not give this preview to a client.'];
  const input = (body.holdings || []).slice(0,12);
  const funds = input.map(function(h){
    const s = DEMO_MF_SCHEMES[h.schemeCode];
    if (!s) throw new Error('This scheme is not in the demo dataset. Select one of the listed demo schemes.');
    const category = (s.category || '').replace('Equity Scheme - ','').replace(' Fund','');
    warnings.push(s.schemeName + ': 3Y fund, peer and benchmark history is unavailable in this demo. Those comparisons are omitted.');
    return {
      schemeCode:s.schemeCode, schemeName:s.schemeName, fundHouse:s.fundHouse,
      category:s.category, normalizedCategory:category, assetClass:'Equity', estimatedEquityPct:100,
      currentValue:Number(h.currentValue), metrics:s.metrics, peerComparison:null,
      benchmarkComparison:null, dataFreshness:'demo'
    };
  });
  const healthFor = function(list){
    const total = list.reduce(function(a,f){return a+(Number(f.currentValue)||0);},0);
    const byFund = list.map(function(f){return {
      schemeCode:f.schemeCode, schemeName:f.schemeName, fundHouse:f.fundHouse,
      currentValue:f.currentValue, weightPct:total ? Math.round(f.currentValue/total*10000)/100 : null
    };});
    const houses = {};
    list.forEach(function(f){houses[f.fundHouse]=(houses[f.fundHouse]||0)+f.currentValue;});
    const byFundHouse = Object.keys(houses).map(function(k){return {fundHouse:k,value:houses[k],weightPct:total?Math.round(houses[k]/total*10000)/100:null};}).sort(function(a,b){return b.value-a.value;});
    const equity = list.reduce(function(a,f){return a+(f.estimatedEquityPct===100?f.currentValue:0);},0);
    const debt = list.reduce(function(a,f){return a+(f.estimatedEquityPct===0?f.currentValue:0);},0);
    return {
      totalValue:total || null, missingValueCount:0, byFund:byFund, byFundHouse:byFundHouse,
      equityDebtMix:{equityPct:total?Math.round(equity/total*10000)/100:null,debtPct:total?Math.round(debt/total*10000)/100:null,unclassifiedValue:null,hasHybridEstimate:false},
      concentration:{maxSingleFund:byFund.slice().sort(function(a,b){return b.weightPct-a.weightPct;})[0]||null,maxFundHouse:byFundHouse[0]||null}
    };
  };
  const health = healthFor(funds);
  const categories = {};
  funds.forEach(function(f){(categories[f.normalizedCategory]=categories[f.normalizedCategory]||[]).push(f);});
  const duplication = Object.keys(categories).filter(function(k){return categories[k].length>1;}).map(function(k){return {
    category:k, schemes:categories[k].map(function(f){return {schemeCode:f.schemeCode,schemeName:f.schemeName,currentValue:f.currentValue};})
  };});
  let horizonFit = null;
  const years = Number(body.client && body.client.horizonYears);
  if (years > 0 && health.equityDebtMix.equityPct !== null) {
    const eq = health.equityDebtMix.equityPct;
    const flag = years <= 3 && eq > 60 ? 'too_aggressive' : years >= 7 && eq < 40 ? 'too_conservative' : 'appropriate';
    horizonFit = {flag:flag,text:'Equity exposure is ' + eq + '% against a ' + years + '-year horizon.'};
  } else warnings.push('No investment horizon supplied - horizon-fit check omitted.');
  const goals = (body.goals || []).map(function(g){
    const months = Math.round(Number(g.years)*12), annual = Number(g.annualReturnPct)/100, monthly = annual/12;
    const factor = monthly > 0 ? ((Math.pow(1+monthly,months)-1)/monthly)*(1+monthly) : months;
    const lump = Number(g.currentValue||0)*Math.pow(1+annual,Number(g.years));
    const sip = Number(g.monthlySip||0)*factor;
    const projected = Math.round(lump+sip), gap = Math.round(Number(g.targetAmount)-projected);
    return Object.assign({},g,{projection:{projectedValue:projected,fvFromCurrentHoldings:Math.round(lump),fvFromFutureSip:Math.round(sip),monthsUsed:months,monthlyRateUsed:Math.round(monthly*1000)/10,annualReturnPctUsed:Number(g.annualReturnPct)},
      gap:gap,additionalMonthlySipRequired:gap<=0?0:Math.round(gap/factor),onTrack:gap<=0});
  });
  let beforeAfter = null;
  const replacements = body.proposedReplacements || {};
  if (Object.keys(replacements).length) {
    const afterFunds = funds.map(function(f){
      const code = replacements[f.schemeCode], s = code && DEMO_MF_SCHEMES[code];
      if (!s) return f;
      return Object.assign({},f,{schemeCode:s.schemeCode,schemeName:s.schemeName,fundHouse:s.fundHouse,category:s.category,
        normalizedCategory:(s.category||'').replace('Equity Scheme - ','').replace(' Fund',''),metrics:s.metrics,
        replacesSchemeCode:f.schemeCode,replacesSchemeName:f.schemeName});
    });
    const illustration = funds.map(function(f){
      const s = DEMO_MF_SCHEMES[replacements[f.schemeCode]];
      if (!s || !f.metrics.return1Y || !s.metrics.return1Y) return null;
      return {oldSchemeName:f.schemeName,newSchemeName:s.schemeName,windowYears:1,investedAmount:f.currentValue,
        oldWouldHaveValue:Math.round(f.currentValue*(1+f.metrics.return1Y.cagrPct/100)),
        newWouldHaveValue:Math.round(f.currentValue*(1+s.metrics.return1Y.cagrPct/100)),isIllustrationOnly:true};
    }).filter(Boolean);
    beforeAfter = {before:{funds:funds,health:health},after:{funds:afterFunds,health:healthFor(afterFunds)},illustration:illustration,
      exitLoadNote:'Exit load data is unavailable. Check the scheme documents before redeeming.',
      taxNote:'Capital gains tax is not computed without transaction history.'};
  }
  return {generatedAt:new Date().toISOString(),client:body.client,funds:funds,
    recommendations:funds.map(function(f){return {schemeCode:f.schemeCode,schemeName:f.schemeName,verdict:'Insufficient data',signals:[],reason:'The demo has no 3Y peer or benchmark evidence for a reliable verdict.'};}),
    duplication:duplication,health:health,horizonFit:horizonFit,beforeAfter:beforeAfter,goals:goals,warnings:warnings,
    methodology:{riskFreeRateUsed:null,benchmarkMethod:'No benchmark proxy figures are shown in demo mode. Live reports disclose the ETF proxy used for each index.',
      peerMethod:'Demo mode omits peer verdicts because complete 3Y data is unavailable.'}};
}

async function demoApi(path, opts) {
  await demoDelay(220);
  const method = (opts && opts.method) || 'GET';
  const body = opts && opts.body && !(opts.body instanceof FormData) ? opts.body : {};

  if (path === '/bootstrap') return DEMO_DB;
  if (path === '/auth/me') return DEMO_DB.user;
  if (path === '/auth/login' || path === '/auth/signup') return DEMO_DB.user;
  if (path === '/auth/logout') return { ok: true };

  // Mutations: the UI already updates its local arrays optimistically before
  // calling api(), so in demo mode we just acknowledge success.
  if (path === '/folioxpert/report' && method === 'POST') return demoFolioReport(body);
  if (path === '/reminders/run-now') return { ok: true, sent: 0 };
  if (path === '/statements/import') return { ok: true, imported: 0 };
  if (path.startsWith('/clients') && method === 'POST') return { id: demoNextId.client++, ...body };
  if (path.startsWith('/leads') && method === 'POST') return { id: demoNextId.lead++, ...body };
  if (path.startsWith('/followups') && method === 'POST') return { id: demoNextId.followup++, ...body };

  if (path.startsWith('/mf/search')) {
    const q = (new URLSearchParams(path.split('?')[1]||'')).get('q')||'';
    const ql = q.toLowerCase();
    const results = Object.values(DEMO_MF_SCHEMES)
      .filter(s => s.schemeName.toLowerCase().includes(ql))
      .map(s => ({ schemeCode: s.schemeCode, schemeName: s.schemeName }));
    return { results };
  }
  if (path === '/folioxpert/extract-cas' && method === 'POST') {
    // Simulate a CAS upload always finding the same 4 demo holdings, regardless of the
    // actual file content - this is a static demo, not a real PDF parser.
    return {
      candidates: [120586, 118989, 125497, 122639].map(code => ({
        rawLine: DEMO_MF_SCHEMES[code].schemeName + '  Closing Balance: 000.000 units',
        match: { schemeCode: code, schemeName: DEMO_MF_SCHEMES[code].schemeName, confidence: 84 + (code % 10) },
        suggestions: [{ schemeCode: code, schemeName: DEMO_MF_SCHEMES[code].schemeName, confidence: 84 + (code % 10) }],
      })),
      isinsFound: ['INF109K01Z48','INF179K01VY8','INF200K01UV3','INF879O01023'],
      schemeIndexReady: true,
    };
  }
  if (path.startsWith('/mf/preview/')) {
    const fund = DEMO_MF_SCHEMES[Number(path.split('/').pop())];
    return fund ? {historyYears:6,dataPoints:fund.metrics.dataPoints,asOfDate:fund.metrics.asOfDate,return1YAvailable:true,rolling1YAvailable:true,rolling3YAvailable:true} : {historyYears:0,dataPoints:0,return1YAvailable:false,rolling1YAvailable:false,rolling3YAvailable:false};
  }

  return { ok: true };
}

async function api(path, opts) {
  if (DEMO_MODE) return demoApi(path, opts);
  const res = await fetch('/api' + path, {
    method: (opts && opts.method) || 'GET',
    headers: opts && opts.body instanceof FormData ? {} : { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    body: opts && opts.body ? (opts.body instanceof FormData ? opts.body : JSON.stringify(opts.body)) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* non-JSON response, e.g. CSV download handled elsewhere */ }
  if (!res.ok) throw new Error((data && data.error) || ('Request failed (' + res.status + ')'));
  return data;
}

/* ---- ID helpers: keep the app's existing 'c1'/'l1'/'m1'/'f1' id scheme,
   backed by real numeric database ids underneath. ---- */
function cid(n){ return 'c'+n; }
function lid(n){ return 'l'+n; }
function midf(n){ return 'm'+n; }
function fid(n){ return 'f'+n; }
function rawId(prefixedId){ return prefixedId ? parseInt(String(prefixedId).slice(1), 10) : null; }
function contactRef(client_id, lead_id){ return client_id ? cid(client_id) : (lead_id ? lid(lead_id) : null); }

function transformClient(row, notesByClient) {
  return {
    id: cid(row.id), dbId: row.id, name: row.name, type: 'client',
    age: row.age || '-', gender: row.gender || '-', city: row.city || '-',
    mobile: row.mobile || '', email: row.email || '', occupation: row.occupation || '-',
    aumL: (row.aum || 0) / 100000, sipMonthly: row.sipAmount || 0, schemes: row.schemes || 0,
    lastReview: row.lastReviewDate ? new Date(row.lastReviewDate) : null,
    nextReview: row.nextReviewDate ? new Date(row.nextReviewDate) : null,
    nextFollowup: null, // filled in by attachComputedFields()
    rm: row.rm || '', vip: !!row.vip, kycPending: !!row.kycPending, sipStopped: !!row.sipStopped,
    riskProfile: row.riskProfile, pan: row.pan, status: row.status,
    goals: (row.goals || []).map(g => ({ ...g })),
    timeline: (row.timeline || []).map(t => ({ date: new Date(t.date), text: t.text })),
    tasks: (row.tasks || []).map(t => ({ ...t })),
    notes: (notesByClient[row.id] || []).map(n => ({ date: new Date(n.created_at), text: n.body })),
  };
}
function transformLead(row) {
  return {
    id: lid(row.id), dbId: row.id, name: row.name, type: 'lead',
    mobile: row.mobile || '', email: row.email || '', city: row.city || '',
    source: row.source || 'Referral', estInvestment: (row.est_investment || 0) / 100000,
    interest: row.interest || '', stage: row.stage || 'New Lead',
    nextFollowup: row.next_followup_date ? new Date(row.next_followup_date) : null,
    notes: row.notes || '',
  };
}
function transformMeeting(row) {
  const dt = new Date(row.scheduled_at);
  const dateOnly = new Date(dt); dateOnly.setHours(0,0,0,0);
  let status = row.status === 'Done' ? 'Completed' : row.status === 'Cancelled' ? 'Cancelled' : 'Upcoming';
  if (status === 'Upcoming' && dt < new Date() && !sameDay(dateOnly, TODAY)) status = 'Overdue';
  return {
    id: midf(row.id), dbId: row.id, date: dateOnly, h: dt.getHours(), m: dt.getMinutes(),
    clientId: contactRef(row.client_id, row.lead_id), clientName: row.client_name || row.lead_name || 'Prospect',
    type: row.type || 'Portfolio Review', status,
  };
}
function transformFollowup(row) {
  return {
    id: fid(row.id), dbId: row.id,
    clientId: contactRef(row.client_id, row.lead_id), clientName: row.client_name || row.lead_name || 'Unknown',
    reason: row.reason, due: new Date(row.due_date), type: 'call',
  };
}

// Fills in nextFollowup on clients/leads from the followups list - keeps a single
// source of truth (the followups table) instead of a separate duplicated date field.
function attachComputedFields() {
  const earliest = {};
  followups.forEach(f => {
    if (!f.clientId) return;
    if (!earliest[f.clientId] || f.due < earliest[f.clientId]) earliest[f.clientId] = f.due;
  });
  clients.forEach(c => { if (earliest[c.id]) c.nextFollowup = earliest[c.id]; });
  leads.forEach(l => { if (!l.nextFollowup && earliest[l.id]) l.nextFollowup = earliest[l.id]; });
}

async function loadData() {
  const data = await api('/bootstrap');
  currentUser = data.user;
  const notesByClient = {};
  (data.notes || []).forEach(n => { (notesByClient[n.client_id] = notesByClient[n.client_id] || []).push(n); });
  clients = data.clients.map(row => transformClient(row, notesByClient));
  leads = data.leads.map(transformLead);
  meetings = data.meetings.map(transformMeeting);
  followups = data.followups.map(transformFollowup);
  attachComputedFields();
}

/* ---- Auth screen ---- */
let authMode = 'login';
function setAuthMode(mode) {
  authMode = mode;
  document.getElementById('authTitle').textContent = mode === 'login' ? 'Sign in' : 'Create your account';
  document.getElementById('authSub').textContent = mode === 'login' ? 'Your practice, one login away.' : 'Set up MF Sarthi for your practice.';
  document.getElementById('authSubmitBtn').textContent = mode === 'login' ? 'Sign In' : 'Create Account';
  document.querySelectorAll('.auth-signup-only').forEach(el => el.style.display = mode === 'signup' ? 'block' : 'none');
  document.getElementById('authSwitch').innerHTML = mode === 'login'
    ? 'New here? <a id="authSwitchLink">Create an account</a>'
    : 'Already have an account? <a id="authSwitchLink">Sign in</a>';
  document.getElementById('authSwitchLink').onclick = () => setAuthMode(mode === 'login' ? 'signup' : 'login');
  document.getElementById('authError').classList.remove('show');
}
function showAuthScreen() { document.getElementById('authScreen').classList.remove('hidden'); }
function hideAuthScreen() { document.getElementById('authScreen').classList.add('hidden'); }

function wireAuthForm() {
  const logoSrc = document.querySelector('.brand-lockup')?.src;
  if (logoSrc) document.querySelector('.auth-logo').src = logoSrc;
  setAuthMode('login');
  document.getElementById('authSwitchLink').onclick = () => setAuthMode('signup');
  document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('authError');
    errEl.classList.remove('show');
    const email = document.getElementById('auth_email').value.trim();
    const password = document.getElementById('auth_password').value;
    const name = document.getElementById('auth_name').value.trim();
    if (!email || !password) { errEl.textContent = 'Please enter your email and password.'; errEl.classList.add('show'); return; }
    if (authMode === 'signup' && !name) { errEl.textContent = 'Please enter your name.'; errEl.classList.add('show'); return; }
    document.getElementById('authScreen').classList.add('loading');
    try {
      await api(authMode === 'login' ? '/auth/login' : '/auth/signup', {
        method: 'POST', body: authMode === 'login' ? { email, password } : { name, email, password },
      });
      await bootAfterAuth();
    } catch (err) {
      errEl.textContent = err.message || 'Something went wrong.';
      errEl.classList.add('show');
    } finally {
      document.getElementById('authScreen').classList.remove('loading');
    }
  });
}

async function bootAfterAuth() {
  await loadData();
  hideAuthScreen();
  const nameEl = document.querySelector('.user-chip .name');
  const roleEl = document.querySelector('.user-chip .role');
  if (nameEl) nameEl.textContent = currentUser.name;
  if (roleEl) roleEl.textContent = currentUser.email;
  const avatarEl = document.querySelector('.user-chip .avatar');
  if (avatarEl) avatarEl.textContent = initials(currentUser.name);
  const topbarAvatarEl = document.getElementById('topbarAvatar');
  if (topbarAvatarEl) topbarAvatarEl.textContent = initials(currentUser.name);
  startApp();
}

async function checkSessionAndBoot() {
  wireAuthForm();
  try {
    await api('/auth/me');
    await bootAfterAuth();
  } catch (e) {
    showAuthScreen();
  }
}

function logout() {
  api('/auth/logout', { method: 'POST' }).finally(() => location.reload());
}
</script>

  mr:{title:'लीडचे क्लायंटमध्ये रूपांतर कसे करावे', intro:'जेव्हा विश्वास शंकेपेक्षा वेगाने तयार होतो, तेव्हाच लीड क्लायंट बनते. प्रॉस्पेक्टला "स्वारस्य" पासून "गुंतवणुकी" पर्यंत नेण्याची ही व्यावहारिक पद्धत आहे.',
    body:['<h3>1. प्रस्ताव देण्याआधी समजून घ्या</h3><p>पहिली भेट पूर्णपणे प्रॉस्पेक्टच्या कॅश फ्लो, सध्याच्या गुंतवणुकी आणि खऱ्या ध्येयावर - घर, मुलांचे शिक्षण, निवृत्ती - केंद्रित करा.</p>','<h3>2. पहिली गुंतवणूक लहान आणि स्पष्ट ठेवा</h3><p>थेट ₹50,000 ऐवजी एका स्पष्ट ध्येयासाठी ₹5,000 ने सुरुवात करा. लहान सुरुवात सवय आणि नाते दोन्ही घडवते.</p>','<h3>3. कागदपत्रांची अडचण कमी करा</h3><p>KYC आणि खाते उघडणे इथेच उत्साही लीड थंड पडते. लिंक पाठवण्याऐवजी कॉलवर किंवा प्रत्यक्ष भेटीत डिजिटल KYC पूर्ण करा.</p>','<h3>4. ठराविक वेळापत्रकानुसार पाठपुरावा करा</h3><p>"विचार करतो" म्हणजे नकार नाही. भेट संपण्याआधी निश्चित तारीख ठरवा आणि ती पाळा.</p>'],
    takeaways:['उत्पादनाऐवजी क्लायंटच्या ध्येयाने सुरुवात करा','पहिली SIP लहान ठेवा - सवय महत्त्वाची','KYC त्वरित पूर्ण करा','निश्चित तारखेचा पाठपुरावा करा']},
  gu:{title:'લીડને ક્લાયન્ટમાં કેવી રીતે રૂપાંતરિત કરવી', intro:'જ્યારે વિશ્વાસ શંકા કરતાં ઝડપથી બંધાય છે, ત્યારે જ લીડ ક્લાયન્ટ બને છે. પ્રોસ્પેક્ટને "રસ" થી "રોકાણ" સુધી લઈ જવાની આ વ્યવહારુ રીત છે.',
    body:['<h3>1. પ્રસ્તાવ આપતાં પહેલાં સમજો</h3><p>પહેલી મુલાકાત સંપૂર્ણપણે પ્રોસ્પેક્ટના કેશ ફ્લો, હાલના રોકાણો અને ખરા ધ્યેય - ઘર, બાળકનું શિક્ષણ, નિવૃત્તિ પર કેન્દ્રિત કરો.</p>','<h3>2. પહેલું રોકાણ નાનું અને સ્પષ્ટ રાખો</h3><p>સીધા ₹50,000ને બદલે એક સ્પષ્ટ ધ્યેય માટે ₹5,000થી શરૂઆત કરાવો.</p>','<h3>3. કાગળિયાંની અડચણ ઓછી કરો</h3><p>KYC અને ખાતું ખોલવું એ જ જગ્યા છે જ્યાં ઉત્સાહી લીડ ઠંડી પડે છે. લિંક મોકલવાને બદલે કૉલ પર અથવા રૂબરૂ ડિજિટલ KYC પૂર્ણ કરાવો.</p>','<h3>4. નિયમિત ફોલો-અપ કરો</h3><p>"વિચારીને કહું છું" એટલે ના નહીં. મુલાકાત પૂરી થાય તે પહેલાં ચોક્કસ તારીખ નક્કી કરો.</p>'],
    takeaways:['પ્રોડક્ટને બદલે ક્લાયન્ટના ધ્યેયથી શરૂઆત કરો','પહેલી SIP નાની રાખો','KYC તરત પૂર્ણ કરાવો','ચોક્કસ તારીખનો ફોલો-અપ રાખો']}
 }},
{id:'a2', cat:'Mutual Fund Knowledge', readMins:5, published:'14 Jul 2026', full:true,
 t:{
  en:{title:'SIP Explained: The Discipline Behind Wealth', intro:'A Systematic Investment Plan is less a product and more a habit - a fixed sum invested on a fixed date, regardless of what the market did yesterday.',
    body:['<h3>What actually happens each month</h3><p>On the chosen date, a fixed amount is auto-debited from the client\'s bank account and used to buy units of the chosen fund at that day\'s NAV. When markets are down, the same rupee amount buys more units; when markets are up, it buys fewer. Over years, this averages the purchase cost - commonly called rupee-cost averaging.</p>','<h3>Why clients underestimate it</h3><p>The visible benefit of a SIP is convenience. The real benefit is behavioural: it removes the temptation to time the market, which is the single biggest reason DIY investors underperform their own funds.</p>','<h3>What to tell a nervous client in a falling market</h3><p>A falling NAV during an active SIP is not a loss on paper investments already made continuing to compound - it is a discount on the units still to be bought. Reframing this correctly is one of the most valuable things an MFD does during volatile months.</p>'],
    takeaways:['SIP automates discipline, not just investment','Falling markets make SIP units cheaper, not "bad"','Your real job is behavioural coaching, not fund-picking']},
  hi:{title:'SIP क्या है: संपत्ति निर्माण के पीछे का अनुशासन', intro:'सिस्टेमेटिक इन्वेस्टमेंट प्लान एक प्रोडक्ट से ज़्यादा एक आदत है - तय तारीख को तय रकम निवेश, चाहे बाज़ार कल कैसा भी रहा हो।',
    body:['<h3>हर महीने असल में क्या होता है</h3><p>तय तारीख पर, तय रकम बैंक खाते से ऑटो-डेबिट होकर उस दिन के NAV पर फंड की यूनिट्स खरीदती है। बाज़ार गिरने पर उतनी ही रकम में ज़्यादा यूनिट्स मिलती हैं।</p>','<h3>क्लाइंट इसे कम क्यों आँकते हैं</h3><p>SIP का दिखने वाला फायदा सुविधा है। असली फायदा व्यवहारगत है - यह बाज़ार को टाइम करने के लालच को खत्म करता है।</p>','<h3>गिरते बाज़ार में घबराए क्लाइंट से क्या कहें</h3><p>गिरता NAV नुकसान नहीं, बल्कि आगे खरीदी जाने वाली यूनिट्स पर छूट है। यही समझाना एक MFD का सबसे मूल्यवान काम है।</p>'],
    takeaways:['SIP अनुशासन को ऑटोमेट करता है','गिरता बाज़ार यूनिट सस्ती करता है, बुरा नहीं','आपका असली काम व्यवहार को संभालना है']},
  mr:{title:'SIP म्हणजे काय: संपत्ती निर्मितीमागील शिस्त', intro:'सिस्टिमॅटिक इन्व्हेस्टमेंट प्लॅन हे उत्पादनापेक्षा एक सवय आहे - ठराविक तारखेला ठराविक रक्कम गुंतवणूक, बाजार कसाही असो.',
    body:['<h3>दर महिन्याला प्रत्यक्षात काय घडते</h3><p>ठरलेल्या तारखेला, ठरलेली रक्कम बँक खात्यातून ऑटो-डेबिट होऊन त्या दिवसाच्या NAV वर युनिट्स खरेदी करते. बाजार खाली असताना तेवढ्याच रकमेत जास्त युनिट्स मिळतात.</p>','<h3>क्लायंट याला कमी का लेखतात</h3><p>SIP चा दिसणारा फायदा सोय आहे. खरा फायदा वर्तनात्मक आहे - बाजार टायमिंगचा मोह टाळतो.</p>','<h3>घसरत्या बाजारात घाबरलेल्या क्लायंटला काय सांगावे</h3><p>घसरलेला NAV म्हणजे तोटा नाही, तर पुढे खरेदी होणाऱ्या युनिट्सवरील सूट आहे.</p>'],
    takeaways:['SIP शिस्त आपोआप घडवते','घसरता बाजार युनिट स्वस्त करतो','तुमचे खरे काम वर्तन सांभाळणे आहे']},
  gu:{title:'SIP એટલે શું: સંપત્તિ નિર્માણ પાછળની શિસ્ત', intro:'સિસ્ટમેટિક ઇન્વેસ્ટમેન્ટ પ્લાન એ પ્રોડક્ટ કરતાં વધુ એક ટેવ છે - નક્કી તારીખે નક્કી રકમનું રોકાણ, બજાર ગમે તેવું હોય.',
    body:['<h3>દર મહિને ખરેખર શું થાય છે</h3><p>નક્કી તારીખે, નક્કી રકમ બેંક ખાતામાંથી ઓટો-ડેબિટ થઈને તે દિવસના NAV પર યુનિટ્સ ખરીદે છે.</p>','<h3>ક્લાયન્ટ આને ઓછું કેમ આંકે છે</h3><p>SIP નો દેખાતો ફાયદો સગવડ છે. ખરો ફાયદો વર્તણૂકીય છે - બજાર ટાઇમ કરવાની લાલચ દૂર કરે છે.</p>','<h3>ઘટતા બજારમાં ગભરાયેલા ક્લાયન્ટને શું કહેવું</h3><p>ઘટતું NAV નુકસાન નથી, પણ હવે પછી ખરીદાનારા યુનિટ્સ પર છૂટ છે.</p>'],
    takeaways:['SIP શિસ્તને ઓટોમેટ કરે છે','ઘટતું બજાર યુનિટ સસ્તા બનાવે છે','તમારું ખરું કામ વર્તન સંભાળવાનું છે']}
 }},
{id:'a3', cat:'Sales & Conversion', readMins:7, published:'21 Jun 2026', full:true,
 t:{
  en:{title:'How to Handle Common Investor Objections', intro:'The same five objections account for most hesitation MFDs hear. Each has a specific, honest response - not a script to overcome the client, but a way to actually answer the concern.',
    body:['<h3>"Markets are too risky right now"</h3><p>Agree that markets are volatile - because they are. Then anchor the conversation to the goal\'s time horizon rather than this week\'s headlines. A 15-year retirement goal is not affected by a 10% correction in year 2.</p>','<h3>"I\'ll invest a lumpsum when the market corrects"</h3><p>This sounds rational but requires predicting two things correctly: when the correction happens, and when to re-enter. Show, don\'t argue - a simple side-by-side of a SIP starting now versus a hypothetical perfectly-timed lumpsum usually settles this.</p>','<h3>"My fixed deposit is safer"</h3><p>It is safer in the sense of not fluctuating - it is not safer in the sense of protecting purchasing power after tax and inflation. Walk through real, not nominal, returns.</p>','<h3>"I need to think about it"</h3><p>This is rarely about the product. Ask directly what specifically they want to think through - cost, safety, timing - and you will usually surface the real objection underneath the polite one.</p>'],
    takeaways:['Never argue with an objection - trace it to the underlying goal','Use time horizon, not this week\'s news, to answer volatility fears','Show real (post-tax, post-inflation) returns for FD comparisons','"I\'ll think about it" is a prompt to ask one more question, not to leave']},
  hi:{title:'निवेशकों की आम आपत्तियों को कैसे संभालें', intro:'यहाँ पाँच आम आपत्तियाँ दी गई हैं जो MFD अक्सर सुनते हैं, हर एक का ईमानदार जवाब के साथ।',
    body:['<h3>"अभी बाज़ार बहुत जोखिम भरा है"</h3><p>सहमत हों कि बाज़ार अस्थिर है। फिर बातचीत को लक्ष्य की समय-सीमा पर ले जाएं, इस हफ्ते की खबर पर नहीं।</p>','<h3>"करेक्शन आने पर लंपसम लगाऊंगा"</h3><p>इसके लिए दो चीज़ें सही अनुमानित करनी होंगी - कब करेक्शन आएगा और कब वापस निवेश करना है। बहस के बजाय तुलना दिखाएं।</p>','<h3>"मेरी FD ज़्यादा सुरक्षित है"</h3><p>यह उतार-चढ़ाव न होने के मायने में सुरक्षित है, टैक्स और महंगाई के बाद खरीद शक्ति बचाने के मायने में नहीं।</p>','<h3>"मुझे सोचना है"</h3><p>सीधे पूछें कि वे असल में किस बारे में सोचना चाहते हैं - लागत, सुरक्षा या समय।</p>'],
    takeaways:['आपत्ति से बहस न करें, असली वजह तक पहुंचें','अस्थिरता के डर का जवाब समय-सीमा से दें','FD तुलना में असली रिटर्न दिखाएं','"सोचना है" पर एक और सवाल पूछें']},
  mr:{title:'गुंतवणूकदारांच्या सामान्य शंकांना कसे सामोरे जावे', intro:'MFD ना वारंवार ऐकू येणाऱ्या पाच सामान्य शंका आणि प्रत्येकीचे प्रामाणिक उत्तर.',
    body:['<h3>"सध्या बाजार खूप जोखमीचा आहे"</h3><p>बाजार अस्थिर आहे हे मान्य करा, मग चर्चा ध्येयाच्या कालावधीकडे न्या, या आठवड्याच्या बातमीकडे नाही.</p>','<h3>"करेक्शन आल्यावर लंपसम गुंतवेन"</h3><p>यासाठी दोन गोष्टी अचूक अंदाजाव्या लागतात - करेक्शन कधी येईल आणि परत कधी गुंतवावे. वाद घालण्याऐवजी तुलना दाखवा.</p>','<h3>"माझी FD जास्त सुरक्षित आहे"</h3><p>ती चढ-उतार नसण्याच्या अर्थाने सुरक्षित आहे, कर आणि महागाईनंतरच्या क्रयशक्तीच्या अर्थाने नाही.</p>','<h3>"मला विचार करायचा आहे"</h3><p>ते नेमके कशाबद्दल विचार करू इच्छितात ते थेट विचारा.</p>'],
    takeaways:['शंकेशी वाद घालू नका, मूळ कारण शोधा','अस्थिरतेच्या भीतीला कालावधीने उत्तर द्या','FD तुलनेत खरा परतावा दाखवा','"विचार करतो" वर आणखी एक प्रश्न विचारा']},
  gu:{title:'રોકાણકારોના સામાન્ય વાંધાઓને કેવી રીતે હેન્ડલ કરવા', intro:'MFD ને વારંવાર સાંભળવા મળતા પાંચ સામાન્ય વાંધા અને દરેકનો પ્રામાણિક જવાબ.',
    body:['<h3>"અત્યારે બજાર ખૂબ જોખમી છે"</h3><p>બજાર અસ્થિર છે તે સ્વીકારો, પછી ચર્ચાને ધ્યેયના સમયગાળા તરફ લઈ જાઓ.</p>','<h3>"કરેક્શન આવે ત્યારે લમ્પસમ રોકીશ"</h3><p>આ માટે બે બાબતો સાચી અનુમાનવી પડે - કરેક્શન ક્યારે આવશે અને ક્યારે ફરી રોકાણ કરવું.</p>','<h3>"મારી FD વધુ સુરક્ષિત છે"</h3><p>તે વધઘટ ન થવાના અર્થમાં સુરક્ષિત છે, ટેક્સ અને મોંઘવારી પછીની ખરીદશક્તિના અર્થમાં નહીં.</p>','<h3>"મારે વિચારવું છે"</h3><p>તેઓ ખરેખર શું વિચારવા માંગે છે તે સીધું પૂછો.</p>'],

<script>
/* ============================================================
   DERIVED / COMPUTED HELPERS
   ============================================================ */
function allContacts(){ return clients.concat(leads); }
function findContact(id){ return allContacts().find(c=>c.id===id); }
function totalAUM(){ return clients.reduce((s,c)=>s+c.aumL,0); }
function totalSIP(){ return clients.reduce((s,c)=>s+c.sipMonthly,0); }
function todaysMeetings(){ return meetings.filter(m=>sameDay(m.date,TODAY)).sort((a,b)=>(a.h*60+a.m)-(b.h*60+b.m)); }
function overdueMeetingsCount(){ return meetings.filter(m=>m.status==='Overdue').length; }
function reviewHealthCounts(){
  const due = clients.filter(c=>c.nextReview && daysBetween(TODAY,c.nextReview)<=30 && daysBetween(TODAY,c.nextReview)>=0).length;
  const overdue = clients.filter(c=>c.nextReview && c.nextReview<TODAY).length;
  const dueWeek = clients.filter(c=>c.nextReview && daysBetween(TODAY,c.nextReview)>=0 && daysBetween(TODAY,c.nextReview)<=7).length;
  const dueMonth = clients.filter(c=>c.nextReview && daysBetween(TODAY,c.nextReview)>=0 && daysBetween(TODAY,c.nextReview)<=30).length;
  const stale = clients.filter(c=>c.lastReview && daysBetween(c.lastReview,TODAY)>365).length;
  return {due,overdue,dueWeek,dueMonth,stale};
}
function pipelineCounts(){
  const stages = ['New Lead','Contacted','Meeting','Proposal'];
  const counts = stages.map(s=>leads.filter(l=>l.stage===s).length);
  counts.push(clients.length); // "Client" stage
  return {stages:[...stages,'Client'], counts};
}
function riskProfileCounts(){
  const order = ['Conservative','Moderate','Aggressive'];
  const colors = {Conservative:'#0D9488',Moderate:'#D89A3E',Aggressive:'#7C3AED'};
  return order.map(label=>({
    label, color: colors[label],
    value: clients.filter(c=>(c.riskProfile||'Moderate')===label).length,
  })).filter(s=>s.value>0);
}
function pipelineDonutSegments(){
  const p = pipelineCounts();
  const colors = ['#2563EB','#0D9488','#D89A3E','#7C3AED','#E11D48'];
  return p.stages.map((s,i)=>({label:s, color:colors[i%colors.length], value:p.counts[i]})).filter(s=>s.value>0);
}

/* ---- donut chart: stroke-based ring built from arc segments ---- */
function donutChartSvg(segments, size){
  size = size || 128;
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  const stroke = Math.round(size*0.16);
  const r = (size-stroke)/2;
  const c = 2*Math.PI*r;
  let offset = 0;
  const arcs = segments.map(seg=>{
    const frac = seg.value/total;
    const len = frac*c;
    const arc = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${stroke}"
      stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" stroke-linecap="round"/>`;
    offset += len;
    return arc;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <g transform="rotate(-90 ${size/2} ${size/2})">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/>
      ${arcs}
    </g>
    <text x="${size/2}" y="${size/2+1}" text-anchor="middle" dominant-baseline="middle" class="donut-center-val" style="font-size:${Math.round(size*0.16)}px;fill:var(--text);">${total}</text>
  </svg>`;
}
function donutCard(title, segments){
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  return `<div class="donut-card">
    <div class="chart-title">${title}</div>
    <div class="donut-body">
      ${donutChartSvg(segments,112)}
      <div class="donut-legend">
        ${segments.map(s=>`<div class="li"><span class="sw" style="background:${s.color}"></span><span class="lname">${esc(s.label)}</span><span class="lval num">${Math.round(s.value/total*100)}%</span></div>`).join('')}
      </div>
    </div>
  </div>`;
}

/* ---- top clients by AUM ---- */
const TC_PALETTE = ['#7C3AED','#2563EB','#0D9488','#D89A3E','#E11D48','#4F46E5','#0EA5E9','#059669'];
function renderTopClients(){
  const top = clients.slice().sort((a,b)=>b.aumL-a.aumL).slice(0,6);
  if(!top.length) return emptyState('i-crm','No clients yet','Add your first client to see them ranked here by AUM.');
  const maxAum = top[0].aumL || 1;
  return top.map((c,i)=>{
    const color = TC_PALETTE[i%TC_PALETTE.length];
    const pct = Math.max(6, Math.round((c.aumL/maxAum)*100));
    return `<div class="top-clients-row" data-open-client="${c.id}">
      <div class="rank num">${i+1}</div>
      <div class="tc-avatar" style="background:${color}">${initials(c.name)}</div>
      <div class="tc-mid">
        <div class="tc-name">${esc(c.name)}${c.vip?'<svg class="tc-vip" viewBox="0 0 24 24"><use href="#i-star"/></svg>':''}</div>
        <div class="tc-sub">${esc(c.city||'-')} · ${c.schemes||0} schemes</div>
        <div class="tc-bar-wrap"><div class="bar" style="width:${pct}%;background:${color}"></div></div>
      </div>
      <div class="tc-aum">
        <div class="n">${fmtLakhs(c.aumL)}</div>
        <div class="sip">${c.sipMonthly>0?('SIP '+fmtRupee(c.sipMonthly)+'/mo'):'No active SIP'}</div>
      </div>
    </div>`;
  }).join('');
}

/* ============================================================
   DASHBOARD RENDER
   ============================================================ */
function renderDashboard(){
  const el = document.getElementById('view-dashboard');
  const rh = reviewHealthCounts();
  const staleClients = clients.filter(c=>c.lastReview && daysBetween(c.lastReview,TODAY)>365);
  const anniversarySIPs = clients.filter(c=>c.sipMonthly>0).slice(0,7);
  const overdueFU = followups.filter(f=>f.due<TODAY).length;
  const kycPending = clients.filter(c=>c.kycPending);
  const sipStopped = clients.filter(c=>c.sipStopped);

  el.innerHTML = `
    <div class="greeting-hero">
      <div class="greeting-row">
        <div class="greeting">
          <h1>${greetingWord()}, <span class="accent-word">${esc((currentUser && currentUser.name ? currentUser.name : 'there').split(' ')[0])}</span></h1>
          <div class="sub">Here's what needs your attention today.</div>
        </div>
        <div class="greeting-live"><span class="dot"></span>Live · updated just now</div>
      </div>
    </div>

    <div class="kpi-grid">
      ${kpiCard('Total Clients', clients.length, 'Current client book','flat',{fmt:'int'})}
      ${kpiCard('Active SIPs', clients.filter(c=>c.sipMonthly>0).length, 'Active client mandates','flat',{fmt:'int'})}
      ${kpiCard('Total AUM', totalAUM(), 'Recorded client AUM','flat',{fmt:'lakh'})}
      ${kpiCard('Monthly SIP Book', totalSIP()/100000, 'Recorded monthly SIPs','flat',{fmt:'lakh'})}
      ${kpiCard('Open Leads', leads.length, 'Current lead pipeline','flat',{fmt:'int'})}
      ${kpiCard('Follow-ups Due', followups.filter(f=>sameDay(f.due,TODAY)||f.due<TODAY).length, overdueFU+' overdue','down',{fmt:'int'})}
    </div>

    <div class="chart-grid">
      <div class="card card-pad chart-card">
        <div class="chart-head">
          <div>
            <div class="chart-title">AUM by relationship manager</div>
            <div class="chart-figure num">${fmtLakhs(totalAUM())}</div>
            <div class="chart-delta">Based on recorded client AUM</div>
          </div>
        </div>
        ${renderAumByRm()}
      </div>
      <div class="card card-pad chart-card donut-stack">
        ${donutCard('Portfolio by Risk Profile', riskProfileCounts())}
        ${donutCard('Lead Pipeline by Stage', pipelineDonutSegments())}
      </div>
    </div>

    <div class="card card-pad" style="margin-bottom:16px;">
      <div class="section-head"><div class="section-title">Top Clients by AUM</div><a class="link-more" data-view="crm" data-filter="Clients">View all clients →</a></div>
      ${renderTopClients()}
    </div>

    <div class="dash-grid">
      <div class="dash-col">
        <div class="card card-pad">
          <div class="section-head"><div class="section-title">Today's Meetings</div><a class="link-more" data-view="meetings">View calendar →</a></div>
          ${renderTodayMeetings()}
        </div>
        <div class="card card-pad">
          <div class="section-head"><div class="section-title">Follow-ups Requiring Attention</div><a class="link-more" data-view="crm" data-filter="Follow-up Due">View all →</a></div>
          ${renderFollowupList(followups.filter(f=>f.due<=addDays(TODAY,1)).slice(0,5))}
        </div>
        <div class="card card-pad">
          <div class="section-head"><div class="section-title">Lead Pipeline</div><a class="link-more" data-view="crm" data-filter="Leads">Open CRM →</a></div>
          ${renderPipeline()}
        </div>
      </div>
      <div class="dash-col">
        <div class="card card-pad">
          <div class="section-head"><div class="section-title">Upcoming Reviews</div><a class="link-more" data-view="meetings">See all →</a></div>
          ${renderUpcomingReviews()}
        </div>
        <div class="card card-pad">
          <div class="section-head"><div class="section-title">Clients Needing Attention</div></div>
          ${renderAttentionList(staleClients, sipStopped, kycPending, anniversarySIPs, overdueFU)}
        </div>
      </div>
    </div>
  `;
  wireRowClicks(el);
  if (!DASHBOARD_MOUNTED) {
    // Play the entrance animation + number count-up only the first time the dashboard
    // appears in this session. Re-rendering after every small action (marking a meeting
    // done, completing a follow-up, adding a note...) used to replay ALL of this every
    // time, which made the whole page look like it was reloading/jumping constantly.
    animateDashboardCounters(el);
    DASHBOARD_MOUNTED = true;
  } else {
    el.querySelectorAll('[data-countup]').forEach(elm=>{
      const raw = parseFloat(elm.getAttribute('data-raw'));
      const fmt = elm.getAttribute('data-fmt');
      if (isFinite(raw)) elm.textContent = fmt==='lakh' ? fmtLakhs(raw) : String(Math.round(raw));
    });
    el.querySelectorAll('.kpi-card,.dash-col .card,.chart-card,.greeting-hero').forEach(node=>{ node.style.animation='none'; });
  }
}
let DASHBOARD_MOUNTED = false;
function greetingWord(){
  const h = new Date().getHours();
  return h<12 ? 'Good morning' : h<17 ? 'Good afternoon' : 'Good evening';
}
function kpiCard(label, rawVal, delta, dir, opts={}){
  const iconMap={'Total Clients':'i-crm','Active SIPs':'i-insight','Total AUM':'i-report','Monthly SIP Book':'i-calc','Open Leads':'i-plus','Follow-ups Due':'i-alert'};
  const gradMap={'Total Clients':'grad-purple','Active SIPs':'grad-blue','Total AUM':'grad-gold','Monthly SIP Book':'grad-teal','Open Leads':'grad-indigo','Follow-ups Due':'grad-rose'};
  const isHero = label==='Total AUM';
  const grad = gradMap[label] || 'grad-purple';
  const fmt = opts.fmt || 'int';
  const display = fmt==='lakh' ? fmtLakhs(rawVal) : String(Math.round(rawVal));
  return `<div class="kpi-card grad ${grad}">
    <div class="kpi-ico-chip"><svg><use href="#${iconMap[label]||'i-insight'}"/></svg></div>
    <div class="lbl">${label}</div>
    <div class="val num" data-countup data-raw="${rawVal}" data-fmt="${fmt}">${display}</div>
    <div class="delta ${dir}">${dir==='down'?'●':'•'} ${delta}</div>
  </div>`;
}
function renderAumByRm(){
  const totals = {};
  clients.forEach(c=>{ const key = c.rm || 'Unassigned'; totals[key] = (totals[key] || 0) + (Number(c.aumL) || 0); });
  const rows = Object.entries(totals).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(!rows.length) return '<p class="fx-help">Add client AUM to see the distribution across your team.</p>';
  const max = Math.max(...rows.map(r=>r[1]),1);
  return '<div class="crm-aum-bars">' + rows.map(([name,value])=>'<div class="crm-aum-row"><span>' + esc(name) + '</span><div><i style="width:' + Math.max(2,value/max*100).toFixed(1) + '%"></i></div><b>' + fmtLakhs(value) + '</b></div>').join('') + '</div>';
}
function animateDashboardCounters(root){
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  root.querySelectorAll('[data-countup]').forEach(elm=>{
    const raw = parseFloat(elm.getAttribute('data-raw'));
    const fmt = elm.getAttribute('data-fmt');
    if(!isFinite(raw)) return;
    const render = v => fmt==='lakh' ? fmtLakhs(v) : String(Math.round(v));
    if(reduce){ elm.textContent = render(raw); return; }
    const dur = 750, start = performance.now();
    function frame(now){
      const p = Math.min(1,(now-start)/dur);
      const eased = 1-Math.pow(1-p,3);
      elm.textContent = render(raw*eased);
      if(p<1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}
function renderTodayMeetings(){
  const list = todaysMeetings();
  if(!list.length) return emptyState('i-cal','No meetings today','Enjoy the clear calendar - a good day to catch up on follow-ups.');
  return list.map(m=>`
    <div class="meeting-row" data-open-client="${m.clientId}">
      <div class="meeting-time num">${fmtTime(m.h,m.m)}</div>
      <div class="meeting-mid">
        <div class="cname">${esc(m.clientName)}</div>
        <div class="ctype">${esc(m.type)} · <span class="badge ${m.status==='Completed'?'badge-success':m.status==='Overdue'?'badge-error':'badge-info'}">${m.status}</span></div>
      </div>
      <div class="meeting-actions">
        <button class="icon-round" title="View" data-open-client="${m.clientId}"><svg viewBox="0 0 24 24"><use href="#i-eye"/></svg></button>
        <button class="icon-round" title="Reschedule" data-reschedule="${m.id}"><svg viewBox="0 0 24 24"><use href="#i-reschedule"/></svg></button>
        <button class="icon-round" title="Mark Complete" data-complete-meeting="${m.id}"><svg viewBox="0 0 24 24"><use href="#i-check"/></svg></button>
      </div>
    </div>`).join('');
}
function renderFollowupList(list){
  if(!list.length) return emptyState('i-check','No follow-ups due','You are fully caught up. New follow-ups will appear here.');
  return list.map(f=>{
    const overdue = f.due<TODAY;
    const dueLabel = sameDay(f.due,TODAY)?'Due today':sameDay(f.due,addDays(TODAY,1))?'Due tomorrow':overdue?'Overdue':fmtDateShort(f.due);
    return `<div class="fu-row">
      <div class="fu-dot ${overdue?'overdue':''}"></div>
      <div class="fu-mid" data-open-client="${f.clientId}">
        <div class="cname">${esc(f.clientName)}</div>
        <div class="reason">${esc(f.reason)}</div>
      </div>
      <div class="fu-due" style="color:${overdue?'var(--error)':'var(--warning)'}">${dueLabel}</div>
      <div class="fu-actions">
        <button class="icon-round" title="Call" data-fu-action="call" data-fu="${f.id}"><svg viewBox="0 0 24 24"><use href="#i-phone"/></svg></button>
        <button class="icon-round" title="WhatsApp" data-fu-action="whatsapp" data-fu="${f.id}"><svg viewBox="0 0 24 24"><use href="#i-whatsapp"/></svg></button>
        <button class="icon-round" title="Email" data-fu-action="email" data-fu="${f.id}"><svg viewBox="0 0 24 24"><use href="#i-mail"/></svg></button>
        <button class="icon-round" title="Complete" data-fu-action="complete" data-fu="${f.id}"><svg viewBox="0 0 24 24"><use href="#i-check"/></svg></button>
      </div>
    </div>`;
  }).join('');
}
function renderUpcomingReviews(){
  const map = {};
  clients.forEach(c=>{
    if(c.nextReview && c.nextReview>=TODAY && daysBetween(TODAY,c.nextReview)<=13){
      const key = c.nextReview.toDateString();
      map[key] = (map[key]||0)+1;
    }
  });
  const keys = Object.keys(map).sort((a,b)=>new Date(a)-new Date(b)).slice(0,5);
  if(!keys.length) return emptyState('i-cal','No upcoming reviews','Reviews scheduled in the next two weeks will show up here.');
  return keys.map(k=>{
    const d = new Date(k);
    const label = sameDay(d,TODAY)?'Today':sameDay(d,addDays(TODAY,1))?'Tomorrow':fmtDate(d,{weekday:'long'});
    return `<div class="review-day">
      <div class="dbox"><div class="dn num">${d.getDate()}</div><div class="dm">${d.toLocaleDateString('en-IN',{month:'short'})}</div></div>
      <div style="flex:1"><div class="rlabel">${label}</div><div class="rcount">${map[k]} client review${map[k]>1?'s':''}</div></div>
      <svg width="15" height="15" style="color:var(--text-faint)" viewBox="0 0 24 24"><use href="#i-chevron-right"/></svg>
    </div>`;
  }).join('');
}
function renderPipeline(){
  const p = pipelineCounts();
  return `<div class="pipeline-row">
    ${p.stages.map((s,i)=>`
      ${i>0?'<svg class="pipe-arrow" viewBox="0 0 24 24"><use href="#i-chevron-right"/></svg>':''}
      <div class="pipe-stage" data-view="crm" data-filter="${s==='Client'?'Clients':s}">
        <div class="n num">${p.counts[i]}</div><div class="lbl">${s}</div>
      </div>`).join('')}
  </div>`;
}
function renderAttentionList(staleClients, sipStopped, kycPending, anniversarySIPs, overdueFU){
  const items = [
    {ico:'i-alert', color:'error', t:`${staleClients.length} clients haven't had a portfolio review in 12+ months.`, d:'Schedule reviews to keep the relationship active.', filter:'No Review'},
    {ico:'i-cal', color:'warning', t:`${anniversarySIPs.length} SIPs are approaching their step-up anniversary.`, d:'A good moment to propose a step-up increase.', filter:'SIP'},
    {ico:'i-bell', color:'error', t:`${overdueFU} follow-ups are overdue.`, d:'These leads and clients are waiting to hear from you.', filter:'Follow-up Due'},
    {ico:'i-alert', color:'warning', t:`${sipStopped.length} SIPs have been stopped.`, d:'Re-engage before the client fully disengages.', filter:'SIP'},
    {ico:'i-report', color:'info', t:`${kycPending.length} clients have KYC verification pending.`, d:'Incomplete KYC blocks further transactions.', filter:'All'},
  ];
  return items.map(it=>`
    <div class="attn-item" data-view="crm" data-filter="${it.filter}">
      <div class="attn-ico" style="background:var(--${it.color}-bg);color:var(--${it.color})"><svg><use href="#${it.ico}"/></svg></div>
      <div class="attn-mid"><div class="t">${it.t}</div><div class="d">${it.d}</div></div>
      <svg width="14" height="14" style="color:var(--text-faint);flex:none;margin-top:9px" viewBox="0 0 24 24"><use href="#i-chevron-right"/></svg>
    </div>`).join('');
}
function emptyState(icon,title,desc){
  return `<div class="empty-state"><svg class="glyph"><use href="#${icon}"/></svg><div class="t">${title}</div><div class="d">${desc}</div></div>`;
}
function wireRowClicks(root){
  root.querySelectorAll('[data-open-client]').forEach(elm=>{
    elm.addEventListener('click', e=>{ e.stopPropagation(); openClientDrawer(elm.getAttribute('data-open-client')); });
  });
  root.querySelectorAll('[data-view]').forEach(elm=>{
    elm.addEventListener('click', e=>{
      e.stopPropagation();
      const v = elm.getAttribute('data-view'); const f = elm.getAttribute('data-filter');
      switchView(v); if(f) setTimeout(()=>applyCrmFilter(f),0);
    });
  });
  root.querySelectorAll('[data-complete-meeting]').forEach(elm=>elm.addEventListener('click', async e=>{
    e.stopPropagation(); const m = meetings.find(x=>x.id===elm.getAttribute('data-complete-meeting'));
    if(m){
      m.status='Completed'; toast('Meeting marked complete'); renderDashboard(); renderMeetings();
      try{ await api('/meetings/'+rawId(m.id), {method:'PUT', body:{status:'Done'}}); }catch(err){ toast('Could not save: '+err.message); }
    }
  }));
  root.querySelectorAll('[data-reschedule]').forEach(elm=>elm.addEventListener('click', async e=>{
    e.stopPropagation(); const m = meetings.find(x=>x.id===elm.getAttribute('data-reschedule'));
    if(m){
      m.date=addDays(m.date,2); m.status='Upcoming'; toast('Meeting rescheduled by 2 days'); renderDashboard(); renderMeetings();
      const newDt = new Date(m.date); newDt.setHours(m.h, m.m, 0, 0);
      try{ await api('/meetings/'+rawId(m.id), {method:'PUT', body:{scheduledAt:newDt.toISOString(), status:'Upcoming'}}); }catch(err){ toast('Could not save: '+err.message); }
    }
  }));
  root.querySelectorAll('[data-fu-action]').forEach(elm=>elm.addEventListener('click', async e=>{
    e.stopPropagation();
    const id = elm.getAttribute('data-fu'); const action = elm.getAttribute('data-fu-action');
    const f = followups.find(x=>x.id===id); if(!f) return;
    if(action==='complete'){
      followups = followups.filter(x=>x.id!==id); toast('Follow-up marked complete','i-check');
      try{ await api('/followups/'+rawId(f.id), {method:'PUT', body:{done:true}}); }catch(err){ toast('Could not save: '+err.message); }
    }
    else if(action==='call'){ toast('Calling '+f.clientName+'… ('+ (findContact(f.clientId)?.mobile||'') +')','i-phone'); }
    else if(action==='whatsapp'){ toast('Opening WhatsApp chat with '+f.clientName,'i-whatsapp'); }
    else if(action==='email'){ toast('Drafting email to '+f.clientName,'i-mail'); }
    renderDashboard();
  }));
}
</script>

<script>
/* ============================================================
   CRM
   ============================================================ */
let crmFilter = 'All';
let crmSearch = '';
function applyCrmFilter(f){ crmFilter = f; switchView('crm'); }
function crmFilteredRows(){
  let rows = allContacts();
  const q = crmSearch.trim().toLowerCase();
  if(q) rows = rows.filter(c=> c.name.toLowerCase().includes(q) || c.mobile.includes(q) || (c.city||'').toLowerCase().includes(q));
  switch(crmFilter){
    case 'Leads': rows = rows.filter(c=>c.type==='lead'); break;
    case 'Prospects': rows = rows.filter(c=>c.type==='lead' && (c.stage==='Meeting'||c.stage==='Proposal')); break;
    case 'Clients': rows = rows.filter(c=>c.type==='client'); break;
    case 'VIP': rows = rows.filter(c=>c.vip); break;
    case 'SIP': rows = rows.filter(c=>c.type==='client' && c.sipMonthly>0); break;
    case 'No Review': rows = rows.filter(c=>c.type==='client' && (!c.lastReview || daysBetween(c.lastReview,TODAY)>365)); break;
    case 'Follow-up Due': rows = rows.filter(c=> (c.nextFollowup && c.nextFollowup<=addDays(TODAY,1)) || followups.some(f=>f.clientId===c.id && f.due<=addDays(TODAY,1))); break;
    default: break;
  }
  return rows;
}
function renderCrm(){
  const el = document.getElementById('view-crm');
  el.innerHTML = `
    <div class="page-head">
      <div><h1>Clients &amp; Leads</h1><div class="sub">${clients.length} clients · ${leads.length} leads in your book</div></div>
      <div style="display:flex;gap:10px">
        <button class="btn" id="btnAddLead"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>Add Lead</button>
        <button class="btn btn-gold" id="btnAddClient"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>Add Client</button>
      </div>
    </div>
    <div class="crm-overview">
      <button data-crm-quick="Clients"><small>Client book</small><b>${clients.length}</b><span>${fmtLakhs(totalAUM())} recorded AUM</span></button>
      <button data-crm-quick="Leads"><small>Open pipeline</small><b>${leads.length}</b><span>Leads to convert</span></button>
      <button data-crm-quick="Follow-up Due"><small>Follow-ups due</small><b>${allContacts().filter(c=>(c.nextFollowup && c.nextFollowup<=addDays(TODAY,1)) || followups.some(f=>f.clientId===c.id && f.due<=addDays(TODAY,1))).length}</b><span>Today or earlier</span></button>
      <button data-crm-quick="No Review"><small>Review gaps</small><b>${clients.filter(c=>!c.lastReview || daysBetween(c.lastReview,TODAY)>365).length}</b><span>Never or over one year</span></button>
    </div>
    <div class="crm-toolbar">
      <div class="crm-search"><svg viewBox="0 0 24 24"><use href="#i-search"/></svg><input id="crmSearchInput" placeholder="Search by name, mobile or city…" value="${esc(crmSearch)}"></div>
      <div class="pill-row" id="crmPills">
        ${['All','Leads','Prospects','Clients','VIP','SIP','No Review','Follow-up Due'].map(f=>`<button class="pill ${crmFilter===f?'active':''}" data-f="${f}">${f}</button>`).join('')}
      </div>
    </div>
    <div class="table-wrap scrollx" id="crmTableWrap"></div>
  `;
  document.getElementById('btnAddLead').onclick = ()=>openModal('addLead');
  document.getElementById('btnAddClient').onclick = ()=>openModal('addClient');
  document.getElementById('crmSearchInput').oninput = (e)=>{ crmSearch = e.target.value; renderCrmTable(); };
  el.querySelectorAll('[data-crm-quick]').forEach(btn=>btn.onclick=()=>{crmFilter=btn.dataset.crmQuick;renderCrm();});
  el.querySelectorAll('#crmPills .pill').forEach(p=>p.onclick = ()=>{ crmFilter = p.getAttribute('data-f'); renderCrm(); });
  renderCrmTable();
}
function renderCrmTable(){
  const wrap = document.getElementById('crmTableWrap');
  const rows = crmFilteredRows();
  if(!rows.length){ wrap.innerHTML = emptyState('i-empty','No matches found','Try a different filter or search term.'); return; }
  wrap.innerHTML = `
    <table>
      <thead><tr>
        <th>Name</th><th>Type</th><th>Mobile</th><th>AUM / Est.</th><th>SIP</th><th>Last Review</th><th>Next Follow-up</th><th>RM</th><th>Status</th>
      </tr></thead>
      <tbody>
        ${rows.map(r=>rowHtml(r)).join('')}
      </tbody>
    </table>
    <div class="crm-foot"><span>Showing ${rows.length} of ${allContacts().length}</span></div>
  `;
  wrap.querySelectorAll('tbody tr').forEach(tr=>{
    tr.addEventListener('click', ()=>openClientDrawer(tr.getAttribute('data-id')));
  });
}
function rowHtml(r){
  const isClient = r.type==='client';
  const statusBadges = [];
  if(isClient){
    if(r.vip) statusBadges.push('<span class="badge badge-gold">VIP</span>');
    if(r.kycPending) statusBadges.push('<span class="badge badge-warning">KYC Pending</span>');
    if(r.sipStopped) statusBadges.push('<span class="badge badge-error">SIP Stopped</span>');
    if(r.lastReview && daysBetween(r.lastReview,TODAY)>365) statusBadges.push('<span class="badge badge-error">Review Overdue</span>');
    if(!statusBadges.length) statusBadges.push('<span class="badge badge-success">Active</span>');
  } else {
    statusBadges.push(`<span class="badge badge-info">${r.stage}</span>`);
  }
  return `<tr data-id="${r.id}">
    <td data-label="Name"><div class="name-cell"><div class="avatar-sm">${initials(r.name)}</div><div><div class="nm">${esc(r.name)}</div><div class="city">${esc(r.city||r.source||'')}</div></div></div></td>
    <td data-label="Type"><span class="badge ${isClient?'badge-neutral':'badge-info'}">${isClient?'Client':'Lead'}</span></td>
    <td data-label="Mobile" class="num">${esc(r.mobile)}</td>
    <td data-label="AUM / Est." class="num">${isClient? fmtLakhs(r.aumL) : fmtLakhs(r.estInvestment)}</td>
    <td data-label="SIP" class="num">${isClient? (r.sipMonthly? fmtRupee(r.sipMonthly)+'/mo':'-') : '-'}</td>
    <td data-label="Last Review">${isClient? (r.lastReview? fmtDateShort(r.lastReview):'Never') : '-'}</td>
    <td data-label="Next Follow-up">${isClient? (r.nextFollowup? fmtDateShort(r.nextFollowup):'-') : (r.nextFollowup? fmtDateShort(r.nextFollowup):'-')}</td>
    <td data-label="RM">${isClient? esc(r.rm) : '-'}</td>
    <td data-label="Status">${statusBadges.join(' ')}</td>
  </tr>`;
}
</script>

<script>
/* ============================================================
   CLIENT PROFILE DRAWER
   ============================================================ */
let activeClientId = null;
let activeDrawerTab = 'overview';
function openClientDrawer(id){
  const c = findContact(id); if(!c) return;
  activeClientId = id; activeDrawerTab = 'overview';
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('clientDrawer').classList.add('open');
  renderDrawer();
}
function closeDrawer(){
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('clientDrawer').classList.remove('open');
}
function overviewFollowupFormHtml(c){
  return `<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
    <div class="section-title" style="font-size:12.5px;margin-bottom:8px">Add a Follow-up</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="fu_reason" placeholder="Reason (e.g. Discuss SIP top-up)" style="flex:2;min-width:160px;border:1px solid var(--border-strong);border-radius:6px;padding:8px 10px;font-size:13px">
      <input id="fu_due" type="date" style="border:1px solid var(--border-strong);border-radius:6px;padding:8px 10px;font-size:13px">
      <button class="btn btn-primary btn-sm" id="addFollowupBtn">Add</button>
    </div>
  </div>`;
}
function renderDrawer(){
  const c = findContact(activeClientId); if(!c) return;
  const isClient = c.type==='client';
  const drawer = document.getElementById('clientDrawer');
  drawer.innerHTML = `
    <div class="drawer-head">
      <div class="av">${initials(c.name)}</div>
      <div style="flex:1">
        <h2>${esc(c.name)}</h2>
        <div class="meta">${isClient? (esc(c.age)+' yrs · '+esc(c.gender)+' · '+esc(c.city)) : (esc(c.source)+' · '+esc(c.interest))} ${c.vip?'<span class="badge badge-gold" style="margin-left:6px">VIP</span>':''}</div>
      </div>
      <button class="icon-btn drawer-close" id="drawerCloseBtn"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
    </div>
    <div class="drawer-body">
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <button class="btn btn-sm" data-dcall><svg viewBox="0 0 24 24"><use href="#i-phone"/></svg>Call</button>
        <button class="btn btn-sm" data-dwa><svg viewBox="0 0 24 24"><use href="#i-whatsapp"/></svg>WhatsApp</button>
        <button class="btn btn-sm" data-dmail><svg viewBox="0 0 24 24"><use href="#i-mail"/></svg>Email</button>
        <button class="btn btn-sm btn-gold" data-dcalc style="margin-left:auto"><svg viewBox="0 0 24 24"><use href="#i-calc"/></svg>Plan / Calculate</button>
      </div>
      <div class="dtabs">
        ${['overview','goals','timeline','notes','tasks'].map(t=>`<div class="dtab ${activeDrawerTab===t?'active':''}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</div>`).join('')}
      </div>
      <div id="drawerPaneHost"></div>
    </div>
  `;
  drawer.querySelector('#drawerCloseBtn').onclick = closeDrawer;
  drawer.querySelectorAll('[data-tab]').forEach(t=>t.onclick = ()=>{ activeDrawerTab = t.getAttribute('data-tab'); renderDrawerPane(); drawer.querySelectorAll('.dtab').forEach(x=>x.classList.toggle('active', x===t)); });
  drawer.querySelector('[data-dcall]').onclick = ()=>toast('Calling '+c.name+'… ('+c.mobile+')','i-phone');
  drawer.querySelector('[data-dwa]').onclick = ()=>toast('Opening WhatsApp chat with '+c.name,'i-whatsapp');
  drawer.querySelector('[data-dmail]').onclick = ()=>toast('Drafting email to '+c.name+' ('+c.email+')','i-mail');
  drawer.querySelector('[data-dcalc]').onclick = ()=>{ closeDrawer(); switchView('calculators'); openCalcForClient(c.id); };
  renderDrawerPane();
}
function renderDrawerPane(){
  const c = findContact(activeClientId); if(!c) return;
  const host = document.getElementById('drawerPaneHost');
  const isClient = c.type==='client';
  let html = '';
  if(activeDrawerTab==='overview'){
    if(isClient){
      html += `<div class="stat-strip">
        <div class="stat-box"><div class="v num">${fmtLakhs(c.aumL)}</div><div class="l">Total AUM</div></div>
        <div class="stat-box"><div class="v num">${c.sipMonthly?fmtRupee(c.sipMonthly):'-'}</div><div class="l">Monthly SIP</div></div>
        <div class="stat-box"><div class="v num">${c.schemes}</div><div class="l">Schemes</div></div>
      </div>
      <div class="kv-grid">
        <div class="kv"><div class="k">Age / Gender</div><div class="v">${esc(c.age)} · ${esc(c.gender)}</div></div>
        <div class="kv"><div class="k">City</div><div class="v">${esc(c.city)}</div></div>
        <div class="kv"><div class="k">Mobile</div><div class="v num">${esc(c.mobile)}</div></div>
        <div class="kv"><div class="k">Email</div><div class="v">${esc(c.email)}</div></div>
        <div class="kv"><div class="k">Occupation</div><div class="v">${esc(c.occupation)}</div></div>
        <div class="kv"><div class="k">Relationship Manager</div><div class="v">${esc(c.rm)}</div></div>
        <div class="kv"><div class="k">Last Review</div><div class="v">${c.lastReview?fmtDate(c.lastReview):'Never'}</div></div>
        <div class="kv"><div class="k">Next Review</div><div class="v">${c.nextReview?fmtDate(c.nextReview):'-'}</div></div>
      </div>${overviewFollowupFormHtml(c)}`;
    } else {
      html += `<div class="stat-strip">
        <div class="stat-box"><div class="v num">${fmtLakhs(c.estInvestment)}</div><div class="l">Est. Investment</div></div>
        <div class="stat-box"><div class="v">${esc(c.stage)}</div><div class="l">Lead Stage</div></div>
        <div class="stat-box"><div class="v">${esc(c.source)}</div><div class="l">Source</div></div>
      </div>
      <div class="kv-grid">
        <div class="kv"><div class="k">Mobile</div><div class="v num">${esc(c.mobile)}</div></div>
        <div class="kv"><div class="k">Email</div><div class="v">${esc(c.email)}</div></div>
        <div class="kv"><div class="k">Interest</div><div class="v">${esc(c.interest)}</div></div>
        <div class="kv"><div class="k">Next Follow-up</div><div class="v">${fmtDate(c.nextFollowup)}</div></div>
      </div>
      <div class="note-item">${esc(c.notes||'')}</div>${overviewFollowupFormHtml(c)}`;
    }
  } else if(activeDrawerTab==='goals'){
    if(isClient && c.goals && c.goals.length){
      html = c.goals.map(g=>{
        const pct = Math.min(100, Math.round(g.current/g.target*100));
        return `<div class="goal-item"><div class="gname">${esc(g.name)}</div><div class="goal-bar-track"><div class="goal-bar-fill" style="width:${pct}%"></div></div><div class="goal-pct">${pct}%</div></div>
        <div style="font-size:11.5px;color:var(--text-muted);margin:-6px 0 6px">${fmtLakhs(g.current)} of ${fmtLakhs(g.target)} target</div>`;
      }).join('');
    } else { html = emptyState('i-report','No goals set','Add an investment goal from the calculator planner.'); }
  } else if(activeDrawerTab==='timeline'){
    const tl = (c.timeline||[]).slice().sort((a,b)=>b.date-a.date);
    html = tl.length? `<div class="timeline">${tl.map(t=>`<div class="tl-item"><div class="date">${fmtDate(t.date)}</div><div class="txt">${esc(t.text)}</div></div>`).join('')}</div>` : emptyState('i-cal','No activity yet','Interactions will appear here as you engage with this contact.');
  } else if(activeDrawerTab==='notes'){
    const notes = c.notes && Array.isArray(c.notes) ? c.notes : [];
    html = `<div id="notesList">${notes.length? notes.slice().reverse().map(n=>`<div class="note-item">${esc(n.text)}<div class="meta">${fmtDate(n.date)}</div></div>`).join('') : emptyState('i-book','No notes yet','Add context from your last conversation.')}</div>
      <div class="form-field full" style="margin-top:12px"><textarea id="newNoteText" placeholder="Add a note about this conversation…"></textarea></div>
      <button class="btn btn-primary btn-sm" id="addNoteBtn"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>Add Note</button>`;
  } else if(activeDrawerTab==='tasks'){
    const tasks = c.tasks && Array.isArray(c.tasks) ? c.tasks : [];
    html = `<div id="tasksList">${tasks.length? tasks.map((t,i)=>`<div class="task-item"><div class="task-check ${t.done?'done':''}" data-idx="${i}"></div><div style="flex:1;${t.done?'text-decoration:line-through;color:var(--text-faint)':''}">${esc(t.text)}</div></div>`).join('') : emptyState('i-check','No tasks yet','Create a follow-up task for this contact.')}</div>
      <div style="display:flex;gap:8px;margin-top:12px"><input id="newTaskText" placeholder="New follow-up task…" style="flex:1;border:1px solid var(--border-strong);border-radius:6px;padding:8px 10px;font-size:13px"><button class="btn btn-primary btn-sm" id="addTaskBtn">Add</button></div>`;
  }
  host.innerHTML = html;
  if(activeDrawerTab==='overview'){
    const fbtn = document.getElementById('addFollowupBtn');
    if(fbtn) fbtn.onclick = async ()=>{
      const reason = document.getElementById('fu_reason').value.trim();
      const due = document.getElementById('fu_due').value;
      if(!reason || !due){ toast('Enter a reason and due date'); return; }
      fbtn.disabled = true;
      try{
        const body = isClient ? {clientId: rawId(c.id), reason, dueDate: due} : {leadId: rawId(c.id), reason, dueDate: due};
        const { followup } = await api('/followups', {method:'POST', body});
        followups.unshift(transformFollowup({...followup, client_name: isClient?c.name:null, lead_name: !isClient?c.name:null}));
        attachComputedFields();
        toast('Follow-up added','i-check');
        renderDrawerPane(); renderDashboard();
      }catch(err){ toast('Could not add follow-up: '+err.message); }
      finally{ fbtn.disabled = false; }
    };
  }
  if(activeDrawerTab==='notes'){
    const btn = document.getElementById('addNoteBtn');
    if(btn) btn.onclick = async ()=>{
      const txt = document.getElementById('newNoteText').value.trim(); if(!txt) return;
      if(!Array.isArray(c.notes)) c.notes = [];
      c.notes.push({date:new Date(), text:txt});
      renderDrawerPane();
      try{
        if(isClient){ await api('/clients/'+rawId(c.id)+'/notes', {method:'POST', body:{body:txt}}); }
        else { const merged = (c.notes_raw||c.notes||'') + '\n' + txt; await api('/leads/'+rawId(c.id), {method:'PUT', body:{notes: typeof c.notes==='string'? merged : txt}}); }
        toast('Note added');
      }catch(err){ toast('Note shown here, but could not save: '+err.message); }
    };
  }
  if(activeDrawerTab==='tasks'){
    const btn = document.getElementById('addTaskBtn');
    if(btn) btn.onclick = async ()=>{
      const txt = document.getElementById('newTaskText').value.trim(); if(!txt) return;
      if(!Array.isArray(c.tasks)) c.tasks = [];
      c.tasks.push({text:txt, done:false});
      renderDrawerPane();
      toast('Task created');
      if(isClient){ try{ await api('/clients/'+rawId(c.id), {method:'PUT', body:{tasks:c.tasks}}); }catch(err){ toast('Could not save task: '+err.message); } }
    };
    host.querySelectorAll('.task-check').forEach(chk=>chk.onclick = async ()=>{
      const i = +chk.getAttribute('data-idx'); c.tasks[i].done = !c.tasks[i].done; renderDrawerPane();
      if(isClient){ try{ await api('/clients/'+rawId(c.id), {method:'PUT', body:{tasks:c.tasks}}); }catch(err){ toast('Could not save: '+err.message); } }
    });
  }
}
</script>

<script>

let calView = 'month';
let calCursor = new Date(TODAY);

  document.getElementById('calPrev').onclick = ()=>{ shiftCal(-1); };

  document.getElementById('calToday').onclick = ()=>{ calCursor = new Date(TODAY); renderCalBody(); };
  el.querySelectorAll('#calViewToggle button').forEach(b=>b.onclick = ()=>{ calView=b.getAttribute('data-v'); renderMeetings(); });
  renderCalBody();

function shiftCal(dir){
  if(calView==='month'){ calCursor.setMonth(calCursor.getMonth()+dir); }
  else if(calView==='week'){ calCursor = addDays(calCursor, dir*7); }
  else { calCursor = addDays(calCursor, dir*7); }
  renderCalBody();
}
function meetingsOn(d){ return meetings.filter(m=>sameDay(m.date,d)); }
function renderCalBody(){
  const label = document.getElementById('calLabel');
  const body = document.getElementById('calBody');
  if(calView==='month'){
    label.textContent = calCursor.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
    const first = new Date(calCursor.getFullYear(), calCursor.getMonth(), 1);
    const startOffset = first.getDay();
    const gridStart = addDays(first, -startOffset);
    let cells = '';
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>cells+=`<div class="month-dow">${d}</div>`);
    for(let i=0;i<42;i++){
      const d = addDays(gridStart,i);
      const inMonth = d.getMonth()===calCursor.getMonth();
      const evts = meetingsOn(d);
      const isToday = sameDay(d,TODAY);
      cells += `<div class="month-cell ${inMonth?'':'other'} ${isToday?'today':''}" data-day="${d.toISOString()}">
        <div class="dn">${d.getDate()}</div>
        ${evts.slice(0,3).map(e=>`<div class="month-evt ${e.status.toLowerCase()}" data-open-client="${e.clientId}">${fmtTime(e.h,e.m).replace(':00','')} ${esc(e.clientName.split(' ')[0])}</div>`).join('')}
        ${evts.length>3?`<div class="month-more">+${evts.length-3} more</div>`:''}
      </div>`;
    }
    body.innerHTML = `<div class="month-grid">${cells}</div>`;
  } else if(calView==='week'){
    const dow = calCursor.getDay();
    const weekStart = addDays(calCursor, -dow);
    const days = Array.from({length:7},(_,i)=>addDays(weekStart,i));
    label.textContent = fmtDateShort(days[0])+' – '+fmtDate(days[6]);
    let head = '<div></div>'+days.map(d=>`<div class="week-head ${sameDay(d,TODAY)?'today':''}">${d.toLocaleDateString('en-IN',{weekday:'short'})}<br>${d.getDate()}</div>`).join('');
    const hours = [9,10,11,12,13,14,15,16,17];
    let rows = '';
    hours.forEach(h=>{
      rows += `<div class="week-time">${fmtTime(h,0)}</div>`;
      days.forEach(d=>{
        const evts = meetingsOn(d).filter(e=>e.h===h);
        rows += `<div class="week-cell">${evts.map(e=>`<div class="week-evt ${e.status.toLowerCase()}" data-open-client="${e.clientId}">${esc(e.clientName)}<br>${esc(e.type)}</div>`).join('')}</div>`;
      });
    });
    body.innerHTML = `<div class="week-grid">${head}${rows}</div>`;
  } else {
    const days = Array.from({length:7},(_,i)=>addDays(calCursor,i));
    label.textContent = fmtDateShort(days[0])+' – '+fmtDate(days[6]);
    body.innerHTML = days.map(d=>{
      const evts = meetingsOn(d).sort((a,b)=>(a.h*60+a.m)-(b.h*60+b.m));
      return `<div class="agenda-day">
        <div class="dlabel">${sameDay(d,TODAY)?'Today · ':''}${d.toLocaleDateString('en-IN',{weekday:'long'})} · ${fmtDateShort(d)}</div>
        ${evts.length? evts.map(e=>`<div class="agenda-item" data-open-client="${e.clientId}">
            <div class="t num">${fmtTime(e.h,e.m)}</div>
            <div class="mid"><div class="cn">${esc(e.clientName)}</div><div class="ty">${esc(e.type)}</div></div>
            <span class="badge ${e.status==='Completed'?'badge-success':e.status==='Overdue'?'badge-error':e.status==='Rescheduled'?'badge-warning':'badge-info'}">${e.status}</span>
          </div>`).join('') : `<div style="padding:14px 4px;color:var(--text-faint);font-size:13px">No meetings scheduled</div>`}
      </div>`;
    }).join('');
  }
  body.querySelectorAll('[data-open-client]').forEach(elm=>elm.addEventListener('click', e=>{ e.stopPropagation(); openClientDrawer(elm.getAttribute('data-open-client')); }));
}
</script>

/* ---- SIP math ---- */
function computeStepupSip(monthly, annualRatePct, years, stepupPct){
  const monthlyRate = annualRatePct/100/12;
  let invested=0, corpus=0, currentMonthly=monthly;
  const yearly=[];
  for(let y=1;y<=years;y++){
    for(let m=0;m<12;m++){ corpus = corpus*(1+monthlyRate) + currentMonthly; invested += currentMonthly; }
    yearly.push({year:y, invested, corpus});
    currentMonthly = currentMonthly*(1+stepupPct/100);
  }
  return {invested, corpus, yearly};
}
function buildChartSvg(yearly){
  const w=540,h=250,padL=54,padR=18,padT=18,padB=30;
  const toL = v=>v/100000;
  const maxV = Math.max(1, toL(yearly[yearly.length-1].corpus));
  const niceMax = Math.ceil(maxV/10)*10 || 10;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const xAt = i => padL + (yearly.length>1 ? i*(innerW/(yearly.length-1)) : innerW/2);
  const yAt = v => padT + innerH - (v/niceMax)*innerH;
  const corpusPts = yearly.map((d,i)=>`${xAt(i)},${yAt(toL(d.corpus))}`).join(' ');
  const investedPts = yearly.map((d,i)=>`${xAt(i)},${yAt(toL(d.invested))}`).join(' ');
  const areaPath = `M${padL},${yAt(0)} L${corpusPts.split(' ').join(' L')} L${xAt(yearly.length-1)},${yAt(0)} Z`;
  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const v = niceMax*f; const y = yAt(v);
    return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>
      <text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--text-faint)" font-family="var(--font-body)">${fmtLakhs(v)}</text>`;
  }).join('');
  const xLabels = yearly.filter((d,i)=> i===0 || i===yearly.length-1 || (yearly.length>6 && i===Math.floor(yearly.length/2)))
    .map(d=>`<text x="${xAt(yearly.indexOf(d))}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="var(--text-faint)" font-family="var(--font-body)">Yr ${d.year}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Chart of invested amount versus projected corpus over time">
    ${gridLines}
    <path d="${areaPath}" fill="var(--gold)" opacity="0.14"/>

}

/* ---- Goal planner math ---- */
function computeGoal(gi){
  const n = Math.max(1, gi.goalAge-gi.currentAge);
  const futureValue = gi.currentCost * Math.pow(1+gi.inflation/100, n);
  const r = gi.rate/100/12; const months = n*12;
  const flatSIP = futureValue / ( (((Math.pow(1+r,months)-1)/r)) * (1+r) );
  // solve step-up % so a lower starting SIP still reaches futureValue
  const startSIP = flatSIP*0.6;
  let lo=0, hi=30, stepup=0;
  for(let i=0;i<28;i++){
    const mid=(lo+hi)/2;
    const res = computeStepupSip(startSIP, gi.rate, n, mid);
    if(res.corpus < futureValue) lo=mid; else hi=mid;
    stepup=mid;
  }
  return {n, futureValue, flatSIP, startSIP, stepup};
}

  };
  document.getElementById('genReportBtn').onclick = ()=>openReport('goal');
  renderGoalResult();

<script>

/* ================= FOLIOXPERT AI ================= */
let fxStep = 0;
let fxMode = 'existing';
let fxClientId = '';
let fxClient = { name:'', age:'', riskProfile:'', horizonYears:'' };
let fxGoals = [];
let fxHoldings = [{ scheme:null, currentValue:'' }];
let fxReplacements = {};
let fxReport = null;
let fxBusy = false;
let fxError = '';
let fxCasCandidates = [];
let fxCasWarnings = [];

function fxMoney(n) { return n === null || n === undefined || !Number.isFinite(Number(n)) ? 'Not available' : fmtRupee(Number(n)); }
function fxPct(n) { return n === null || n === undefined || !Number.isFinite(Number(n)) ? 'Not available' : Number(n).toFixed(2) + '%'; }
function fxMetric(n) { return n === null || n === undefined || !Number.isFinite(Number(n)) ? 'Not available' : String(n); }
function fxReturn(r, years) {
  if (!r || r.cagrPct === null || r.cagrPct === undefined) return 'Not available';
  return fxPct(r.cagrPct) + (r.actualYears !== undefined && r.actualYears !== null && Number(r.actualYears) < years - 0.1 ? ' over ' + fxMetric(r.actualYears) + ' years (partial ' + years + 'Y window)' : r.isAnnualized ? ' p.a.' : ' total over ' + fxMetric(r.actualYears) + ' years');
}
function fxValue(v) { return v === null || v === undefined ? '' : esc(v); }
function fxInput(label, id, value, type, extra) {
  return '<div class="form-field"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + (type || 'text') + '" value="' + fxValue(value) + '" ' + (extra || '') + '></div>';
}
function fxWarnings(warnings) {
  return warnings && warnings.length ? '<div class="fx-warn-box"><div class="t">Data and calculation notes</div><ul>' + warnings.map(function(w){ return '<li>' + esc(w) + '</li>'; }).join('') + '</ul></div>' : '';
}
function fxSetError(message) { fxError = message; renderFolioXpert(); }
function fxClientPayload() {
  return { name:fxClient.name.trim(), age:fxClient.age === '' ? null : Number(fxClient.age),
    riskProfile:fxClient.riskProfile || null, horizonYears:fxClient.horizonYears === '' ? null : Number(fxClient.horizonYears) };
}
function fxGoalPayload() {
  return fxGoals.map(function(g) { return {
    name:g.name.trim(), targetAmount:Number(g.targetAmount), years:Number(g.years),
    currentValue:g.currentValue === '' ? 0 : Number(g.currentValue),
    monthlySip:g.monthlySip === '' ? 0 : Number(g.monthlySip),
    annualReturnPct:Number(g.annualReturnPct)
  }; });
}
function fxHoldingPayload() {
  return fxHoldings.filter(function(h){ return h.scheme; }).map(function(h){
    return { schemeCode:h.scheme.schemeCode, currentValue:Number(h.currentValue) };
  });
}
function fxValidStep() {
  if (fxStep === 0) {
    if (!fxClient.name.trim()) return 'Enter or select a client name.';
    if (fxClient.age !== '' && (!Number.isFinite(Number(fxClient.age)) || Number(fxClient.age) <= 0)) return 'Enter a valid client age.';
    if (fxClient.horizonYears !== '' && (!Number.isFinite(Number(fxClient.horizonYears)) || Number(fxClient.horizonYears) <= 0)) return 'Enter a valid investment horizon.';
  }
  if (fxStep === 1) {
    for (const g of fxGoals) {
      if (!g.name.trim() || !(Number(g.targetAmount) > 0) || !(Number(g.years) > 0) ||
          g.annualReturnPct === '' || !Number.isFinite(Number(g.annualReturnPct)) || Number(g.annualReturnPct) < 0 ||
          (g.currentValue !== '' && !(Number(g.currentValue) >= 0)) ||
          (g.monthlySip !== '' && !(Number(g.monthlySip) >= 0))) {
        return 'Each goal needs a name, target amount, years, and an advisor-entered return assumption. Amounts cannot be negative.';
      }
    }
  }
  if (fxStep === 2) {
    const selected = fxHoldings.filter(function(h){ return h.scheme; });
    if (!selected.length) return 'Select at least one scheme from the search results.';
    if (selected.length > 12) return 'A report can include up to 12 holdings.';
    if (fxHoldings.some(function(h){ return !h.scheme && h.currentValue !== ''; })) return 'Select a scheme for every value entered.';
    if (selected.some(function(h){ return !(Number(h.currentValue) > 0); })) return 'Enter a current value greater than zero for every selected holding.';
    const codes = selected.map(function(h){ return h.scheme.schemeCode; });
    if (new Set(codes).size !== codes.length) return 'Each scheme can appear only once. Combine duplicate holdings into one value.';
