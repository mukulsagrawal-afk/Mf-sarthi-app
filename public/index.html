<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MF Sarthi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MF SARTHI - DESIGN SYSTEM (tokens)
   ============================================================ */
:root{
  --ink:#0A2647;            /* deep premium navy - primary */
  --ink-2:#123B6B;
  --gold:#C08A34;           /* richer antique gold - accent. Used sparingly. */
  --gold-soft:#E0B563;
  --gold-glow:rgba(192,138,52,.35);
  --teal:#0E6B54;           /* secondary - growth */
  --violet:#6D5BD0;         /* tertiary - data accent, used only in sparklines/highlights */
  --violet-soft:rgba(109,91,208,.16);
  --bg:#F6F7F9;             /* cool, minimal canvas */
  --surface:#FFFFFF;
  --surface-2:#EEF0F4;
  --surface-3:#F9FAFB;
  --border:#E5E7EC;
  --border-strong:#D2D6E0;
  --text:#0B0E14;
  --text-muted:#5B6270;
  --text-faint:#9AA1AC;
  --success:#188857;
  --success-bg:#E7F4ED;
  --warning:#B0741F;
  --warning-bg:#FBF1E0;
  --error:#C13F35;
  --error-bg:#FCEAE8;
  --info:#3A5A8C;
  --info-bg:#EAF0F9;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05),0 1px 1px rgba(15,23,42,.03);
  --shadow-md:0 16px 32px -12px rgba(15,23,42,.16);
  --shadow-lift:0 22px 44px -16px rgba(15,23,42,.22);
  --shadow-glow-gold:0 0 0 1px rgba(192,138,52,.22),0 16px 34px -10px rgba(192,138,52,.35);
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;
  --radius-xl:22px;
  --font-display:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-body:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
  --ease-premium:cubic-bezier(.16,1,.3,1);
  --sidebar-w:236px;
  /* sidebar reads as part of the same light canvas - a quiet rail, not a colour block */
  --sidebar-bg:#FFFFFF;
  --sidebar-bg-2:#FBFBFC;
  --sidebar-text:#5B6270;
  --sidebar-text-strong:#10151F;
  --sidebar-border:#E7E9ED;
  --sidebar-active-bg:rgba(180,130,60,.10);
  --sidebar-hover-bg:#F3F4F6;
  --sidebar-accent:#B4823C;  /* fixed brass - sidebar canvas stays light in both themes */
  --sidebar-ink:#0B3258;     /* fixed navy for avatar/logo-adjacent chrome on the light rail */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E7D9B8; --ink-2:#F2E7C9;
    --gold:#E0B15C; --gold-soft:#EFCB86; --gold-glow:rgba(224,177,92,.35);
    --teal:#39B48D;
    --violet:#9C8CF0; --violet-soft:rgba(156,140,240,.20);
    --bg:#0A0B10; --surface:#121319; --surface-2:#181A22; --surface-3:#1E212B;
    --border:#242732; --border-strong:#333744;
    --text:#F1EEE6; --text-muted:#A7A395; --text-faint:#716C60;
    --success:#4FCE9B; --success-bg:#12291F;
    --warning:#E7AE5F; --warning-bg:#332510;
    --error:#E88178; --error-bg:#341E1B;
    --info:#93B5EC; --info-bg:#182338;
    --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow-md:0 20px 40px -16px rgba(0,0,0,.6);
    --shadow-lift:0 26px 52px -18px rgba(0,0,0,.65);
    --shadow-glow-gold:0 0 0 1px rgba(224,177,92,.28),0 18px 40px -12px rgba(224,177,92,.30);
    /* sidebar stays a light brand rail even in dark mode - the mark's navy ink needs a light backdrop to read */
    --sidebar-bg:#F4F1E9; --sidebar-bg-2:#EEEADD;
    --sidebar-text:#6B655A; --sidebar-text-strong:#1C1A15;
    --sidebar-border:#E3DECE; --sidebar-active-bg:rgba(180,130,60,.16); --sidebar-hover-bg:#EAE5D6;
    --sidebar-accent:#B4823C; --sidebar-ink:#0B3258;
  }
}
:root[data-theme="dark"]{
  --ink:#E7D9B8; --ink-2:#F2E7C9;
  --gold:#E0B15C; --gold-soft:#EFCB86; --gold-glow:rgba(224,177,92,.35);
  --teal:#39B48D;
  --violet:#9C8CF0; --violet-soft:rgba(156,140,240,.20);
  --bg:#0A0B10; --surface:#121319; --surface-2:#181A22; --surface-3:#1E212B;
  --border:#242732; --border-strong:#333744;
  --text:#F1EEE6; --text-muted:#A7A395; --text-faint:#716C60;
  --success:#4FCE9B; --success-bg:#12291F;
  --warning:#E7AE5F; --warning-bg:#332510;
  --error:#E88178; --error-bg:#341E1B;
  --info:#93B5EC; --info-bg:#182338;
  --sidebar-bg:#F4F1E9; --sidebar-bg-2:#EEEADD;
  --sidebar-text:#6B655A; --sidebar-text-strong:#1C1A15;
  --sidebar-border:#E3DECE; --sidebar-active-bg:rgba(180,130,60,.16); --sidebar-hover-bg:#EAE5D6;
  --sidebar-accent:#B4823C; --sidebar-ink:#0B3258;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow-md:0 20px 40px -16px rgba(0,0,0,.6);
  --shadow-lift:0 26px 52px -18px rgba(0,0,0,.65);
  --shadow-glow-gold:0 0 0 1px rgba(224,177,92,.28),0 18px 40px -12px rgba(224,177,92,.30);
}

/* ============================================================
   RESET / BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-body);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;color:var(--text);}
p{margin:0;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
::selection{background:var(--gold-soft);color:var(--ink);}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-mono);}
.scrollx{overflow-x:auto;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{display:flex;min-height:100vh;}

/* ---- Sidebar ---- */
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);
  color:var(--sidebar-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  z-index:40;
}
.sidebar-brand{display:flex;align-items:center;padding:24px 20px 18px;border-bottom:1px solid var(--sidebar-border);margin-bottom:6px;}
.brand-lockup{width:100%;max-width:168px;height:auto;display:block;}
.sidebar-scroll{flex:1;overflow-y:auto;padding:8px 10px;}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--text-faint);padding:18px 11px 7px;font-weight:700;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--radius-sm);
  color:var(--sidebar-text);font-size:13.5px;font-weight:500;margin-bottom:2px;transition:background .15s,color .15s;
  position:relative;
}
.nav-item svg{width:17px;height:17px;flex:none;opacity:.75;}
.nav-item:hover{background:var(--sidebar-hover-bg);color:var(--sidebar-text-strong);}
.nav-item.active{background:var(--sidebar-active-bg);color:var(--sidebar-text-strong);font-weight:700;}
.nav-item.active svg{opacity:1;color:var(--sidebar-accent);}
.nav-item.active::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--sidebar-accent);}
.nav-badge{margin-left:auto;background:var(--error);color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:1px 6px;}
.sidebar-foot{padding:14px 14px 18px;border-top:1px solid var(--sidebar-border);}
.user-chip{display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:var(--radius-sm);padding:6px;margin:0 -6px;transition:background .15s;}
.user-chip:hover{background:var(--sidebar-hover-bg);}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--sidebar-ink);color:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex:none;}
.user-chip .name{font-size:13px;font-weight:600;color:var(--sidebar-text-strong);}
.user-chip .role{font-size:11px;color:var(--text-faint);}

/* ---- Main column ---- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:14px 28px;
}
.menu-toggle{display:none;background:none;border:none;color:var(--text);padding:6px;}
.topbar-search{flex:1;max-width:420px;position:relative;}
.topbar-search input{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:9px 12px 9px 34px;font-size:13.5px;color:var(--text);
}
.topbar-search input:focus{outline:none;border-color:var(--gold-soft);background:var(--surface);}
.topbar-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-faint);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:6px;}
.icon-btn{
  position:relative;width:36px;height:36px;border-radius:50%;border:1px solid transparent;background:none;
  display:flex;align-items:center;justify-content:center;color:var(--text-muted);transition:background .15s;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text);}
.icon-btn svg{width:18px;height:18px;}
.dot-flag{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--error);border:1.5px solid var(--surface);}
.topbar-date{font-size:12.5px;color:var(--text-muted);white-space:nowrap;}

.view{display:none;padding:24px 28px 60px;max-width:1400px;width:100%;margin:0 auto;}
.view.active{display:block;animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}

/* ============================================================
   TYPE / COMMON UI
   ============================================================ */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.page-head h1{font-size:23px;}
.page-head .sub{color:var(--text-muted);font-size:13.5px;margin-top:4px;}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:700;margin-bottom:6px;}

.btn{
  display:inline-flex;align-items:center;gap:7px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);
  background:var(--surface);color:var(--text);font-size:13px;font-weight:600;padding:9px 14px;transition:.15s;white-space:nowrap;
}
.btn svg{width:15px;height:15px;}
.btn:hover{border-color:var(--text-faint);background:var(--surface-2);}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#F3EDD8;}
.btn-primary:hover{background:var(--ink-2);border-color:var(--ink-2);}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#241800;}
.btn-gold:hover{filter:brightness(1.06);}
.btn-ghost{border-color:transparent;background:none;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn-danger{color:var(--error);border-color:var(--error);background:var(--error-bg);}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.02em;}
.badge-success{background:var(--success-bg);color:var(--success);}
.badge-warning{background:var(--warning-bg);color:var(--warning);}
.badge-error{background:var(--error-bg);color:var(--error);}
.badge-info{background:var(--info-bg);color:var(--info);}
.badge-neutral{background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);}
.badge-gold{background:rgba(192,138,52,.14);color:var(--gold);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);}
.card-pad{padding:20px 22px;}
.section-title{font-size:15px;font-weight:700;font-family:var(--font-display);}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.link-more{font-size:12.5px;color:var(--ink);font-weight:700;}
.link-more:hover{color:var(--gold);text-decoration:underline;}

.pill-row{display:flex;gap:8px;flex-wrap:wrap;}
.pill{
  border:1px solid var(--border-strong);background:var(--surface);border-radius:20px;padding:6px 13px;font-size:12.5px;
  font-weight:600;color:var(--text-muted);transition:.15s;
}
.pill:hover{border-color:var(--text-faint);color:var(--text);}
.pill.active{background:var(--ink);border-color:var(--ink);color:#F3EDD8;}

.empty-state{padding:36px 20px;text-align:center;color:var(--text-muted);}
.empty-state .glyph{width:34px;height:34px;margin:0 auto 12px;color:var(--text-faint);}
.empty-state .t{font-weight:700;color:var(--text);font-size:13.5px;margin-bottom:3px;}
.empty-state .d{font-size:12.5px;}

.avatar-sm{width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink);flex:none;}

::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:20px;}
::-webkit-scrollbar-track{background:transparent;}

/* toast */
#toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--ink);color:#F3EDD8;padding:11px 16px;border-radius:var(--radius-md);font-size:13px;font-weight:600;
  box-shadow:var(--shadow-md);display:flex;align-items:center;gap:9px;animation:toastin .2s ease;max-width:320px;
}
.toast svg{width:15px;height:15px;color:var(--gold-soft);flex:none;}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ============================================================
   DASHBOARD
   ============================================================ */
@keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes glowBreathe{0%,100%{opacity:.55;transform:scale(1);}50%{opacity:.9;transform:scale(1.06);}}
@keyframes dashPulse{0%,100%{box-shadow:0 0 0 0 currentColor;}50%{box-shadow:0 0 0 3px transparent;}}
@keyframes shimmerSweep{from{transform:translateX(-120%) skewX(-12deg);}to{transform:translateX(220%) skewX(-12deg);}}

.greeting-hero{
  position:relative;overflow:hidden;border-radius:var(--radius-xl);
  padding:26px 28px;margin-bottom:22px;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);
}
.greeting-hero::before,.greeting-hero::after{
  content:'';position:absolute;border-radius:50%;filter:blur(38px);pointer-events:none;
  animation:glowBreathe 8s ease-in-out infinite;
}
.greeting-hero::before{width:260px;height:260px;top:-120px;right:-60px;background:radial-gradient(circle,var(--gold-glow),transparent 70%);}
.greeting-hero::after{width:220px;height:220px;bottom:-140px;right:180px;background:radial-gradient(circle,var(--violet-soft),transparent 70%);animation-delay:2.4s;}
.greeting-row{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.greeting h1{font-size:26px;margin-bottom:4px;letter-spacing:-.01em;}
.greeting h1 .accent-word{background:linear-gradient(95deg,var(--gold) 10%,var(--gold-soft) 55%,var(--violet) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.greeting .sub{color:var(--text-muted);font-size:13.5px;}
.greeting-live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--success);background:var(--success-bg);padding:5px 11px 5px 9px;border-radius:20px;}
.greeting-live .dot{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 0 0 var(--success);animation:dashPulse 2s ease-in-out infinite;}

.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:22px;}
.kpi-card{
  position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:16px 16px 38px;box-shadow:var(--shadow-sm);
  transition:box-shadow .3s var(--ease-premium),transform .3s var(--ease-premium),border-color .3s;
  animation:riseIn .5s var(--ease-premium) both;
}
.kpi-grid .kpi-card:nth-child(1){animation-delay:.02s}
.kpi-grid .kpi-card:nth-child(2){animation-delay:.06s}
.kpi-grid .kpi-card:nth-child(3){animation-delay:.10s}
.kpi-grid .kpi-card:nth-child(4){animation-delay:.14s}
.kpi-grid .kpi-card:nth-child(5){animation-delay:.18s}
.kpi-grid .kpi-card:nth-child(6){animation-delay:.22s}
.kpi-card:hover{box-shadow:var(--shadow-lift);transform:translateY(-3px);border-color:var(--border-strong);}
.kpi-card.hero{
  background:linear-gradient(165deg,rgba(192,138,52,.12),var(--surface) 60%);
  border-color:rgba(192,138,52,.35);box-shadow:var(--shadow-glow-gold);
}
.kpi-card.hero:hover{transform:translateY(-3px) scale(1.008);}
.kpi-ico-chip{
  width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);margin-bottom:9px;transition:transform .3s var(--ease-premium);
}
.kpi-card:hover .kpi-ico-chip{transform:scale(1.1) rotate(-4deg);}
.kpi-card.hero .kpi-ico-chip{background:linear-gradient(135deg,var(--gold),var(--gold-soft));}
.kpi-ico-chip svg{width:14px;height:14px;color:var(--text-muted);}
.kpi-card.hero .kpi-ico-chip svg{color:#2A1B00;}
.kpi-card .lbl{font-size:11.5px;color:var(--text-muted);font-weight:600;margin-bottom:2px;}
.kpi-card .val{font-family:var(--font-display);font-size:23px;font-weight:700;color:var(--text);letter-spacing:-.01em;}
.kpi-card.hero .val{color:var(--ink);}
.kpi-card .delta{font-size:11.5px;margin-top:6px;font-weight:700;display:inline-flex;align-items:center;gap:3px;}
.delta.up{color:var(--success);}
.delta.down{color:var(--error);}
.delta.flat{color:var(--text-faint);}
.kpi-spark{position:absolute;left:0;right:0;bottom:0;width:100%;height:26px;opacity:.9;pointer-events:none;}

.dash-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start;}
.dash-col{display:flex;flex-direction:column;gap:16px;}
.dash-col .card{animation:riseIn .45s var(--ease-premium) both;}
.dash-col:first-child .card:nth-child(1){animation-delay:.08s}
.dash-col:first-child .card:nth-child(2){animation-delay:.14s}
.dash-col:first-child .card:nth-child(3){animation-delay:.20s}
.dash-col:last-child .card:nth-child(1){animation-delay:.11s}
.dash-col:last-child .card:nth-child(2){animation-delay:.17s}
.card{transition:box-shadow .3s var(--ease-premium),border-color .3s;}
.card.card-pad:hover{box-shadow:var(--shadow-md);}

.meeting-row{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--border);border-radius:10px;transition:background .2s;}
.meeting-row:hover{background:var(--surface-2);}
.meeting-row:last-child{border-bottom:none;}
.meeting-time{width:64px;flex:none;font-size:12.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;font-family:var(--font-mono);}
.meeting-mid{flex:1;min-width:0;}
.meeting-mid .cname{font-size:13.5px;font-weight:700;}
.meeting-mid .ctype{font-size:12px;color:var(--text-muted);margin-top:1px;}
.meeting-actions{display:flex;gap:6px;flex:none;}

.fu-row{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--border);border-radius:10px;transition:background .2s;}
.fu-row:hover{background:var(--surface-2);}
.fu-row:last-child{border-bottom:none;}
.fu-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--warning);}
.fu-dot.overdue{background:var(--error);box-shadow:0 0 0 3px var(--error-bg);animation:dashPulse 2.2s ease-in-out infinite;}
.fu-mid{flex:1;min-width:0;}
.fu-mid .cname{font-size:13.5px;font-weight:700;}
.fu-mid .reason{font-size:12px;color:var(--text-muted);margin-top:1px;}
.fu-due{font-size:11px;font-weight:700;flex:none;font-family:var(--font-mono);}
.fu-actions{display:flex;gap:4px;flex:none;}
.icon-round{width:28px;height:28px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-muted);transition:.2s var(--ease-premium);}
.icon-round:hover{background:var(--ink);color:var(--gold-soft);border-color:var(--ink);transform:scale(1.08);}
.icon-round svg{width:14px;height:14px;}

.review-day{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border);border-radius:10px;transition:background .2s;}
.review-day:hover{background:var(--surface-2);}
.review-day:last-child{border-bottom:none;}
.review-day .dbox{width:44px;height:44px;flex:none;border-radius:var(--radius-md);background:var(--surface-2);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.2s;}
.review-day:hover .dbox{background:var(--ink);border-color:var(--ink);}
.review-day:hover .dbox .dn,.review-day:hover .dbox .dm{color:var(--gold-soft);}
.review-day .dbox .dn{font-size:15px;font-weight:800;color:var(--ink);line-height:1;font-family:var(--font-mono);}
.review-day .dbox .dm{font-size:9px;text-transform:uppercase;color:var(--text-faint);letter-spacing:.06em;}
.review-day .rlabel{font-size:13px;font-weight:700;}
.review-day .rcount{font-size:11.5px;color:var(--text-muted);}

.pipeline-row{display:flex;gap:8px;}
.pipe-stage{flex:1;text-align:center;padding:14px 6px;border-radius:var(--radius-md);background:var(--surface-2);border:1px solid var(--border);transition:.25s var(--ease-premium);cursor:pointer;}
.pipe-stage:hover{border-color:var(--gold-soft);background:var(--surface);transform:translateY(-2px);box-shadow:var(--shadow-sm);}
.pipe-stage .n{font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--ink);}
.pipe-stage .lbl{font-size:10.5px;color:var(--text-muted);margin-top:3px;font-weight:600;}
.pipe-arrow{align-self:center;color:var(--text-faint);flex:none;width:14px;}

.attn-item{display:flex;align-items:flex-start;gap:11px;padding:12px 6px;border-bottom:1px solid var(--border);transition:.2s;border-radius:10px;}
.attn-item:last-child{border-bottom:none;}
.attn-item:hover{background:var(--surface-2);transform:translateX(2px);}
.attn-ico{width:32px;height:32px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;transition:transform .25s var(--ease-premium);}
.attn-item:hover .attn-ico{transform:scale(1.08);}
.attn-ico svg{width:16px;height:16px;}
.attn-mid{flex:1;}
.attn-mid .t{font-size:13px;font-weight:700;}
.attn-mid .d{font-size:12px;color:var(--text-muted);margin-top:1px;}

/* ---- colorful gradient KPI cards ---- */
.kpi-card.grad{border:none;color:#fff;box-shadow:var(--shadow-sm);}
.kpi-card.grad .lbl{color:rgba(255,255,255,.78);}
.kpi-card.grad .val{color:#fff;}
.kpi-card.grad .delta{color:rgba(255,255,255,.92);background:rgba(255,255,255,.16);padding:2px 8px;border-radius:20px;}
.kpi-card.grad .kpi-ico-chip{background:rgba(255,255,255,.18);}
.kpi-card.grad .kpi-ico-chip svg{color:#fff;}
.kpi-card.grad:hover{box-shadow:var(--shadow-lift);}
.kpi-card.grad-purple{background:linear-gradient(150deg,#7C3AED,#4338CA 85%);}
.kpi-card.grad-blue{background:linear-gradient(150deg,#2563EB,#1E3A8A 85%);}
.kpi-card.grad-gold{background:linear-gradient(150deg,#D89A3E,#8A5A1E 88%);}
.kpi-card.grad-teal{background:linear-gradient(150deg,#0D9488,#065F46 88%);}
.kpi-card.grad-indigo{background:linear-gradient(150deg,#6366F1,#312E81 88%);}
.kpi-card.grad-rose{background:linear-gradient(150deg,#E11D48,#881337 88%);}

/* ---- premium chart row: AUM trend + donuts ---- */
.chart-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:stretch;margin-bottom:16px;}
.chart-card{animation:riseIn .45s var(--ease-premium) both;}
.chart-card .chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px;}
.chart-card .chart-title{font-size:13.5px;font-weight:700;color:var(--text-muted);}
.chart-card .chart-figure{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-.01em;margin-top:2px;}
.chart-card .chart-delta{font-size:12px;font-weight:700;color:var(--success);margin-top:3px;}
.area-chart{width:100%;height:auto;margin-top:10px;}
.area-chart .gridline{stroke:var(--border);stroke-width:1;}
.area-chart .month-lbl{font-size:9.5px;fill:var(--text-faint);font-family:var(--font-body);}

.donut-stack{display:flex;flex-direction:column;gap:16px;height:100%;}
.donut-card{flex:1;display:flex;flex-direction:column;}
.donut-body{display:flex;align-items:center;gap:16px;margin-top:8px;}
.donut-body svg{flex:none;}
.donut-legend{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0;}
.donut-legend .li{display:flex;align-items:center;gap:8px;font-size:12px;}
.donut-legend .sw{width:9px;height:9px;border-radius:3px;flex:none;}
.donut-legend .lname{flex:1;color:var(--text-muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.donut-legend .lval{font-weight:700;font-family:var(--font-mono);}
.donut-center-val{font-family:var(--font-mono);font-weight:800;}

/* ---- top clients by AUM ---- */
.top-clients-row{display:flex;align-items:center;gap:12px;padding:11px 6px;border-radius:10px;transition:background .2s;cursor:pointer;}
.top-clients-row:hover{background:var(--surface-2);}
.top-clients-row .rank{width:20px;flex:none;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--text-faint);text-align:center;}
.tc-avatar{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;}
.top-clients-row .tc-mid{flex:1;min-width:0;}
.top-clients-row .tc-name{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
.top-clients-row .tc-sub{font-size:11.5px;color:var(--text-muted);margin-top:1px;}
.tc-bar-wrap{width:120px;flex:none;height:5px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:5px;}
.tc-bar-wrap .bar{height:100%;border-radius:4px;transition:width .6s var(--ease-premium);}
.top-clients-row .tc-aum{width:110px;flex:none;text-align:right;}
.top-clients-row .tc-aum .n{font-family:var(--font-mono);font-weight:700;font-size:14px;}
.top-clients-row .tc-aum .sip{font-size:11px;color:var(--text-muted);}
.tc-vip{width:14px;height:14px;color:var(--gold);flex:none;}

@media (max-width:1100px){
  .chart-grid{grid-template-columns:1fr;}
}
@media (max-width:720px){
  .donut-body{flex-direction:column;align-items:flex-start;}
  .top-clients-row .tc-bar-wrap{display:none;}
}

/* ============================================================
   CRM
   ============================================================ */
.crm-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.crm-search{flex:1;min-width:200px;position:relative;}
.crm-search input{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface);font-size:13px;}
.crm-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-faint);}
.table-wrap{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface);}
table{width:100%;border-collapse:collapse;min-width:920px;}
thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);
  font-weight:700;padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr{cursor:pointer;transition:background .12s;}
tbody tr:hover{background:var(--surface-2);}
.name-cell{display:flex;align-items:center;gap:10px;}
.name-cell .nm{font-weight:700;}
.name-cell .city{font-size:11.5px;color:var(--text-muted);}
.crm-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;font-size:12.5px;color:var(--text-muted);}

/* ---- Drawer (client profile) ---- */
.drawer-overlay{position:fixed;inset:0;background:rgba(15,20,30,.42);z-index:100;opacity:0;pointer-events:none;transition:opacity .18s;}
.drawer-overlay.open{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;right:0;height:100vh;width:min(560px,94vw);background:var(--surface);z-index:101;
  box-shadow:var(--shadow-md);transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.8,.3,1);
  display:flex;flex-direction:column;
}
.drawer.open{transform:translateX(0);}
.drawer-head{padding:20px 22px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:14px;}
.drawer-head .av{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--gold-soft);font-family:var(--font-display);font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;}
.drawer-head h2{font-size:19px;}
.drawer-head .meta{font-size:12.5px;color:var(--text-muted);margin-top:3px;}
.drawer-close{margin-left:auto;}
.drawer-body{flex:1;overflow-y:auto;padding:18px 22px 40px;}
.dtabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.dtab{padding:9px 4px;margin-right:16px;font-size:12.5px;font-weight:700;color:var(--text-muted);border-bottom:2px solid transparent;}
.dtab.active{color:var(--ink);border-color:var(--gold);}
.dpane{display:none;}
.dpane.active{display:block;}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-bottom:18px;}
.kv{font-size:13px;}
.kv .k{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;}
.kv .v{font-weight:600;}
.stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
.stat-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;text-align:center;}
.stat-box .v{font-family:var(--font-display);font-size:16.5px;font-weight:600;color:var(--ink);}
.stat-box .l{font-size:10.5px;color:var(--text-muted);margin-top:3px;}
.goal-item{display:flex;align-items:center;justify-content:between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.goal-item:last-child{border-bottom:none;}
.goal-item .gname{font-weight:700;font-size:13px;flex:1;}
.goal-bar-track{flex:2;height:6px;background:var(--surface-2);border-radius:20px;overflow:hidden;}
.goal-bar-fill{height:100%;background:var(--gold);border-radius:20px;}
.goal-pct{font-size:12px;font-weight:700;color:var(--text-muted);width:38px;text-align:right;}
.timeline{position:relative;padding-left:18px;}
.timeline::before{content:'';position:absolute;left:4px;top:4px;bottom:4px;width:1.5px;background:var(--border);}
.tl-item{position:relative;padding-bottom:16px;}
.tl-item::before{content:'';position:absolute;left:-18px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--gold);}
.tl-item .date{font-size:11px;color:var(--text-faint);font-weight:700;text-transform:uppercase;}
.tl-item .txt{font-size:13px;margin-top:2px;}
.note-item{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:8px;font-size:13px;}
.note-item .meta{font-size:11px;color:var(--text-faint);margin-top:5px;}
.task-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.task-item:last-child{border-bottom:none;}
.task-check{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--border-strong);flex:none;}
.task-check.done{background:var(--success);border-color:var(--success);}

/* ============================================================
   MODALS
   ============================================================ */
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,30,.46);z-index:110;display:none;align-items:center;justify-content:center;padding:24px;}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--surface);border-radius:var(--radius-lg);width:min(640px,100%);max-height:88vh;display:flex;flex-direction:column;
  box-shadow:var(--shadow-md);animation:modalin .18s cubic-bezier(.2,.8,.3,1);
}
@keyframes modalin{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
.modal-head h3{font-size:17px;}
.modal-body{padding:20px 22px;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-field{display:flex;flex-direction:column;gap:5px;}
.form-field.full{grid-column:1/-1;}
.form-field label{font-size:12px;font-weight:700;color:var(--text-muted);}
.form-field input,.form-field select,.form-field textarea{
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:9px 11px;font-size:13px;background:var(--surface);color:var(--text);
}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:none;border-color:var(--gold);}
.form-field textarea{resize:vertical;min-height:64px;}
.chip-select{display:flex;flex-wrap:wrap;gap:6px;}
.chip-opt{border:1px solid var(--border-strong);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text-muted);}
.chip-opt.sel{background:var(--ink);border-color:var(--ink);color:#F3EDD8;}

/* ============================================================
   CALCULATORS
   ============================================================ */
.calc-cat{margin-bottom:26px;}
.calc-cat-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);margin-bottom:10px;}
.calc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.calc-tile{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;transition:.15s;
}
.calc-tile:hover{border-color:var(--gold-soft);box-shadow:var(--shadow-sm);transform:translateY(-1px);}
.calc-tile .ico{width:34px;height:34px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;margin-bottom:12px;color:var(--ink);}
.calc-tile .ico svg{width:17px;height:17px;}
.calc-tile .t{font-weight:700;font-size:14px;margin-bottom:3px;}
.calc-tile .d{font-size:12px;color:var(--text-muted);}

.calc-work{display:grid;grid-template-columns:1fr 1.05fr;gap:20px;align-items:start;}
.calc-input-card{padding:22px;}
.slider-field{margin-bottom:20px;}
.slider-field .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.slider-field label{font-size:12.5px;font-weight:700;color:var(--text-muted);}
.slider-field .valbox{display:flex;align-items:center;border:1px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden;}
.slider-field .valbox span{padding:4px 6px;font-size:12px;color:var(--text-faint);background:var(--surface-2);}
.slider-field .valbox input{border:none;width:74px;padding:4px 6px;font-size:13px;font-weight:700;text-align:right;background:var(--surface);}
.slider-field .valbox input:focus{outline:none;}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:var(--border-strong);border-radius:4px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--gold);cursor:pointer;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--gold);}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--gold);cursor:pointer;border:2px solid var(--surface);}

.result-card{padding:22px;}
.result-hero{text-align:left;padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.result-hero .l{font-size:12px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.result-hero .v{font-family:var(--font-display);font-size:34px;font-weight:600;color:var(--ink);margin-top:5px;}
.result-split{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
.result-split .box{text-align:center;}
.result-split .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;}
.result-split .lbl{font-size:11px;color:var(--text-muted);font-weight:600;}
.result-split .v{font-size:15px;font-weight:700;font-family:var(--font-display);margin-top:3px;}
.chart-wrap{margin-top:6px;}
.legend-row{display:flex;gap:16px;margin-bottom:10px;font-size:11.5px;color:var(--text-muted);}
.legend-row .dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px;}

.mode-toggle{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:3px;margin-bottom:18px;width:fit-content;}
.mode-toggle button{border:none;background:none;padding:7px 16px;font-size:12.5px;font-weight:700;color:var(--text-muted);border-radius:8px;}
.mode-toggle button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}

.client-attach-box{border:1px dashed var(--border-strong);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:18px;display:flex;align-items:center;gap:12px;}
.client-attach-box.filled{border-style:solid;border-color:var(--gold-soft);background:rgba(169,124,47,.06);}
.client-attach-box .info{flex:1;font-size:13px;}
.client-attach-box .info b{font-size:13.5px;}

/* ============================================================
   MEETINGS & REVIEW CALENDAR
   ============================================================ */
.cal-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.cal-nav{display:flex;align-items:center;gap:6px;}
.cal-month-label{font-family:var(--font-display);font-size:16px;font-weight:600;min-width:150px;text-align:center;}
.view-toggle{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:3px;margin-left:auto;}
.view-toggle button{border:none;background:none;padding:7px 14px;font-size:12.5px;font-weight:700;color:var(--text-muted);border-radius:8px;}
.view-toggle button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}

.health-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
.health-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:15px 16px;}
.health-box .v{font-family:var(--font-display);font-size:24px;font-weight:600;}
.health-box .l{font-size:11.5px;color:var(--text-muted);font-weight:600;margin-top:4px;}
.health-box.warn .v{color:var(--warning);}
.health-box.err .v{color:var(--error);}

.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
.month-dow{background:var(--surface-2);padding:8px;text-align:center;font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--text-muted);letter-spacing:.05em;}
.month-cell{background:var(--surface);min-height:88px;padding:6px 7px;position:relative;}
.month-cell.other{background:var(--surface-2);opacity:.5;}
.month-cell.today{background:rgba(169,124,47,.07);}
.month-cell .dn{font-size:12px;font-weight:700;color:var(--text-muted);}
.month-cell.today .dn{color:var(--gold);background:var(--gold);color:#241800;display:inline-flex;width:19px;height:19px;border-radius:50%;align-items:center;justify-content:center;}
.month-evt{font-size:10px;background:var(--info-bg);color:var(--info);border-radius:4px;padding:2px 5px;margin-top:3px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.month-evt.completed{background:var(--success-bg);color:var(--success);}
.month-evt.overdue{background:var(--error-bg);color:var(--error);}
.month-evt.rescheduled{background:var(--warning-bg);color:var(--warning);}
.month-more{font-size:10px;color:var(--text-faint);margin-top:2px;font-weight:600;}

.week-grid{display:grid;grid-template-columns:56px repeat(7,1fr);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface);}
.week-head{padding:9px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--text-muted);border-bottom:1px solid var(--border);border-left:1px solid var(--border);}
.week-head.today{color:var(--gold);}
.week-time{font-size:10px;color:var(--text-faint);padding:6px 6px 0;text-align:right;}
.week-cell{min-height:52px;border-top:1px solid var(--border);border-left:1px solid var(--border);padding:3px;}
.week-evt{font-size:10.5px;background:var(--info-bg);color:var(--info);border-radius:5px;padding:3px 6px;margin-bottom:2px;font-weight:600;}
.week-evt.completed{background:var(--success-bg);color:var(--success);}
.week-evt.overdue{background:var(--error-bg);color:var(--error);}

.agenda-day{margin-bottom:20px;}
.agenda-day .dlabel{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.agenda-item{display:flex;align-items:center;gap:14px;padding:11px 4px;border-bottom:1px solid var(--border);}
.agenda-item:last-child{border-bottom:none;}
.agenda-item .t{width:66px;flex:none;font-weight:700;font-size:12.5px;color:var(--ink);}
.agenda-item .mid{flex:1;}
.agenda-item .mid .cn{font-weight:700;font-size:13.5px;}
.agenda-item .mid .ty{font-size:12px;color:var(--text-muted);}

/* ============================================================
   KNOWLEDGE HUB
   ============================================================ */
.kb-layout{display:grid;grid-template-columns:220px 1fr;gap:22px;align-items:start;}
.kb-cat-list{display:flex;flex-direction:column;gap:2px;position:sticky;top:80px;}
.kb-cat-item{padding:9px 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:var(--text-muted);}
.kb-cat-item.active{background:var(--surface-2);color:var(--ink);}
.kb-cat-item:hover{background:var(--surface-2);}
.kb-cat-count{float:right;color:var(--text-faint);font-weight:400;}
.article-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
.article-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:17px;transition:.15s;}
.article-card:hover{border-color:var(--gold-soft);box-shadow:var(--shadow-sm);}
.article-card .cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);font-weight:700;margin-bottom:8px;}
.article-card .t{font-weight:700;font-size:14.5px;font-family:var(--font-display);margin-bottom:6px;line-height:1.3;}
.article-card .ex{font-size:12.5px;color:var(--text-muted);line-height:1.5;margin-bottom:12px;}
.article-card .meta{font-size:11px;color:var(--text-faint);display:flex;gap:10px;align-items:center;}
.lang-badge{font-size:9.5px;font-weight:700;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;}

.lang-switch{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:3px;}
.lang-switch button{border:none;background:none;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--text-muted);border-radius:7px;}
.lang-switch button.active{background:var(--ink);color:#F3EDD8;}

.article-view{max-width:680px;}
.article-view .cat{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);font-weight:700;margin-bottom:10px;}
.article-view h1{font-size:27px;line-height:1.25;margin-bottom:10px;}
.article-view .meta{font-size:12.5px;color:var(--text-muted);display:flex;gap:14px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border);}
.article-view .intro{font-size:15.5px;color:var(--text-muted);line-height:1.65;margin-bottom:20px;font-family:var(--font-display);}
.article-body{font-size:14.5px;line-height:1.8;}
.article-body p{margin-bottom:15px;}
.article-body h3{font-size:16px;margin:22px 0 10px;}
.article-body ul{margin:0 0 15px;padding-left:20px;}
.article-body li{margin-bottom:6px;}
.takeaways{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin:24px 0;}
.takeaways .t{font-weight:700;font-size:13px;margin-bottom:10px;}
.takeaways ul{margin:0;padding-left:18px;}
.takeaways li{margin-bottom:6px;font-size:13.5px;}
.article-actions{display:flex;gap:10px;margin:22px 0;}
.related-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}

/* ============================================================
   SEARCH DROPDOWN
   ============================================================ */
.search-results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-md);box-shadow:var(--shadow-md);max-height:380px;overflow-y:auto;display:none;z-index:60;
}
.search-results.open{display:block;}
.sr-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;padding:9px 14px 4px;}
.sr-item{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:13px;}
.sr-item:hover{background:var(--surface-2);}
.sr-item .t{font-weight:600;}
.sr-item .s{font-size:11.5px;color:var(--text-muted);margin-left:auto;}

/* notifications dropdown */
.notif-dd{
  position:absolute;top:46px;right:0;width:320px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-md);z-index:60;display:none;overflow:hidden;
}
.notif-dd.open{display:block;}
.notif-dd .hd{padding:13px 16px;font-weight:700;font-size:13px;border-bottom:1px solid var(--border);}
.notif-item{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);font-size:12.5px;}
.notif-item:last-child{border-bottom:none;}
.notif-item .ico{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--gold);}
.notif-item .ico svg{width:13px;height:13px;}
.notif-item .txt b{font-weight:700;}
.notif-item .when{color:var(--text-faint);font-size:11px;margin-top:2px;}

/* ============================================================
   REPORT (screen preview + print)
   ============================================================ */
.report-overlay{position:fixed;inset:0;background:#3A3A34;z-index:150;display:none;overflow-y:auto;padding:32px 0;}
.report-overlay.open{display:block;}
.report-toolbar{position:sticky;top:0;background:var(--ink);color:#F3EDD8;display:flex;align-items:center;justify-content:center;gap:12px;padding:12px;margin:-32px 0 24px;}
.report-page{
  width:210mm;min-height:297mm;background:#fff;color:#1B1A16;margin:0 auto;padding:16mm 16mm;
  box-shadow:0 10px 40px rgba(0,0,0,.4);font-family:var(--font-body);
}
.rp-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #12203A;padding-bottom:14px;margin-bottom:22px;}
.rp-brand{display:flex;align-items:center;gap:9px;}
.rp-brand img{height:46px;width:auto;display:block;}
.rp-brand .word{font-family:var(--font-display);font-size:19px;font-weight:600;color:#0B3258;}
.rp-head .meta{text-align:right;font-size:11.5px;color:#555;}
.rp-title{font-family:var(--font-display);font-size:22px;margin-bottom:4px;color:#12203A;}
.rp-sub{font-size:12.5px;color:#666;margin-bottom:20px;}
.rp-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.rp-box{border:1px solid #ddd;border-radius:8px;padding:12px 14px;}
.rp-box .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#888;margin-bottom:6px;font-weight:700;}
.rp-box .row{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;}
.rp-hero{background:#F6F3EC;border:1px solid #e4dfd1;border-radius:10px;padding:18px 20px;text-align:center;margin-bottom:20px;}
.rp-hero .v{font-family:var(--font-display);font-size:30px;color:#A97C2F;font-weight:600;}
.rp-hero .l{font-size:11.5px;color:#666;margin-top:4px;}
.rp-split{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;text-align:center;}
.rp-split .v{font-size:15px;font-weight:700;}
.rp-split .l{font-size:10.5px;color:#777;}
.rp-obs{background:#fff;border:1px solid #ddd;border-radius:8px;padding:14px 16px;margin-bottom:18px;}
.rp-obs .t{font-weight:700;font-size:12.5px;margin-bottom:8px;}
.rp-obs ul{margin:0;padding-left:18px;font-size:12px;}
.rp-obs li{margin-bottom:5px;}
.rp-disclaimer{font-size:9.5px;color:#888;border-top:1px solid #ddd;padding-top:12px;margin-top:26px;line-height:1.6;}
.rp-foot{display:flex;justify-content:space-between;font-size:10.5px;color:#999;margin-top:10px;}

@media print{
  body *{visibility:hidden;}
  .report-page, .report-page *{visibility:visible;}
  .report-page{position:absolute;top:0;left:0;box-shadow:none;margin:0;width:210mm;min-height:297mm;}
  .report-toolbar{display:none;}
  @page{size:A4;margin:0;}
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1180px){
  .kpi-grid{grid-template-columns:repeat(3,1fr);}
  .dash-grid{grid-template-columns:1fr;}
  .calc-work{grid-template-columns:1fr;}
  .kb-layout{grid-template-columns:1fr;}
  .kb-cat-list{position:static;flex-direction:row;flex-wrap:wrap;}
  .health-strip{grid-template-columns:repeat(3,1fr);}
}
@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-md);}
  .sidebar.open{transform:translateX(0);}
  .menu-toggle{display:flex;}
  .topbar-date{display:none;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  table{min-width:0;}
  thead{display:none;}
  tbody tr{display:block;padding:12px 14px;border-bottom:1px solid var(--border);}
  tbody td{display:flex;justify-content:space-between;border:none;padding:4px 0;white-space:normal;}
  tbody td::before{content:attr(data-label);font-size:11px;color:var(--text-faint);font-weight:700;}
  .form-grid{grid-template-columns:1fr;}
  .result-split{grid-template-columns:1fr 1fr;}
  .report-page{width:100%;padding:8mm;}
  .month-grid{font-size:11px;}
  .week-grid{display:none;}
}

/* ---- Auth screen ---- */
#authScreen{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;}
#authScreen.hidden{display:none;}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:32px 28px;}
.auth-logo{width:100%;max-width:170px;display:block;margin:0 auto 22px;}
.auth-card h2{font-size:19px;margin-bottom:4px;text-align:center;}
.auth-card .sub{color:var(--text-muted);font-size:13px;text-align:center;margin-bottom:22px;}
.auth-field{margin-bottom:12px;}
.auth-field label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:5px;}
.auth-field input{width:100%;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:9px 11px;font-size:13.5px;background:var(--surface);color:var(--text);}
.auth-field input:focus{outline:none;border-color:var(--gold-soft);}
.auth-error{background:var(--error-bg);color:var(--error);font-size:12.5px;font-weight:600;padding:8px 11px;border-radius:var(--radius-sm);margin-bottom:12px;display:none;}
.auth-error.show{display:block;}
.auth-submit{width:100%;margin-top:6px;justify-content:center;}
.auth-switch{text-align:center;font-size:12.5px;color:var(--text-muted);margin-top:16px;}
.auth-switch a{color:var(--ink);font-weight:700;cursor:pointer;}
#authScreen.loading .auth-card{opacity:.5;pointer-events:none;}

/* ================= FOLIOXPERT AI ================= */
.ai-mode-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border-strong);border-radius:11px;padding:10px 16px;background:var(--surface);color:var(--text-muted);font-size:12.5px;font-weight:700;transition:background .2s,border-color .2s,box-shadow .2s;}
.ai-mode-btn:hover{border-color:var(--gold);background:var(--surface-3);}
.ai-mode-btn.active{color:var(--ink);border-color:var(--gold);background:var(--warning-bg);box-shadow:inset 0 0 0 1px rgba(192,138,52,.18);}
.picker-dd{display:none;position:absolute;z-index:35;top:calc(100% + 8px);left:0;right:0;max-height:330px;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;box-shadow:0 20px 45px rgba(19,35,68,.16),0 3px 8px rgba(19,35,68,.05);padding:5px;transform-origin:top center;}
.picker-dd.open{display:block;animation:pickerReveal .23s cubic-bezier(.2,.8,.2,1) both;}
.picker-dd .pdd-heading,.picker-dd .pdd-footer{padding:9px 11px;color:var(--text-muted);font-size:10px;font-weight:700;letter-spacing:.075em;text-transform:uppercase;}
.picker-dd .pdd-footer{border-top:1px solid var(--border);font-weight:500;letter-spacing:0;text-transform:none;}
.picker-dd .pdd-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 11px;margin:1px 0;font:inherit;line-height:1.4;cursor:pointer;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--text);animation:pickerItem .22s ease both;animation-delay:var(--item-delay,0ms);transition:background .16s,border-color .16s,transform .16s;}
.picker-dd .pdd-item:hover,.picker-dd .pdd-item.active,.picker-dd .pdd-item:focus-visible{background:var(--surface-3);border-color:var(--border);transform:translateX(2px);outline:none;}
.picker-dd .pdd-icon{display:grid;place-items:center;flex:none;width:31px;height:31px;border-radius:9px;background:var(--violet-soft);color:var(--violet);font-size:15px;font-weight:700;}
.picker-dd .pdd-copy{min-width:0;flex:1;font-size:12px;font-weight:600;overflow-wrap:anywhere;}
.picker-dd .pdd-meta{display:block;margin-top:3px;color:var(--text-muted);font-size:10px;font-weight:500;}
.picker-dd .pdd-arrow{color:var(--gold);font-size:17px;opacity:0;transform:translateX(-4px);transition:opacity .16s,transform .16s;}
.picker-dd .pdd-item:hover .pdd-arrow,.picker-dd .pdd-item.active .pdd-arrow,.picker-dd .pdd-item:focus-visible .pdd-arrow{opacity:1;transform:none;}
.picker-dd .pdd-empty{display:flex;align-items:center;justify-content:center;gap:9px;padding:18px 12px;font-size:12px;color:var(--text-muted);text-align:center;}
.picker-dd .pdd-spinner{display:inline-block;width:15px;height:15px;border:2px solid var(--border-strong);border-top-color:var(--violet);border-radius:50%;animation:pickerSpin .8s linear infinite;}
@keyframes pickerReveal{from{opacity:0;transform:translateY(-7px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pickerItem{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pickerSpin{to{transform:rotate(360deg)}}
.fx-steps{display:flex;align-items:center;gap:0;margin-bottom:20px;flex-wrap:wrap;}
.fx-step{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--text-faint);padding:8px 14px 8px 8px;}
.fx-step .n{width:22px;height:22px;border-radius:50%;background:var(--surface-2);color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:11px;flex:none;}
.fx-step.active{color:var(--ink);}
.fx-step.active .n{background:linear-gradient(135deg,var(--violet),var(--gold));color:#fff;}
.fx-step.done .n{background:var(--success);color:#fff;}
.fx-step-sep{width:22px;height:1.5px;background:var(--border-strong);flex:none;}

.fx-toggle{display:flex;gap:10px;margin-bottom:16px;}
.fx-client-pick{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:8px;cursor:pointer;transition:.15s;}
.fx-client-pick:hover{border-color:var(--gold-soft);background:var(--surface-2);}
.fx-client-pick .av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex:none;}
.fx-client-pick .mid{flex:1;min-width:0;}
.fx-client-pick .nm{font-weight:700;font-size:13.5px;}
.fx-client-pick .sub{font-size:11.5px;color:var(--text-muted);}

.fx-goal-row{display:grid;grid-template-columns:1.4fr 1fr 1fr .9fr .9fr auto;gap:10px;align-items:end;padding:12px 0;border-bottom:1px solid var(--border);}
.fx-goal-row:last-child{border-bottom:none;}
.fx-goal-row label{display:block;font-size:10.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
.fx-goal-row input,.fx-goal-row select{width:100%;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:8px 9px;font-size:12.5px;background:var(--surface);color:var(--text);}
.fx-remove-btn{width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--error);display:flex;align-items:center;justify-content:center;flex:none;}

.fx-holding-row{display:grid;grid-template-columns:2fr 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);position:relative;}
.fx-holding-row:last-child{border-bottom:none;}
.fx-holding-row input{width:100%;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:9px 11px;font-size:12.5px;}

.fx-warn-box{background:var(--warning-bg);border:1px solid rgba(176,116,31,.25);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:16px;}
.fx-warn-box .t{font-size:12px;font-weight:700;color:var(--warning);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.fx-warn-box ul{margin:0;padding-left:18px;}
.fx-warn-box li{font-size:12px;color:var(--text-muted);margin-bottom:3px;line-height:1.5;}

.fx-verdict{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 11px;border-radius:999px;white-space:nowrap;}
.fx-verdict.keep{color:var(--success);background:var(--success-bg);}
.fx-verdict.monitor{color:var(--warning);background:var(--warning-bg);}
.fx-verdict.review{color:var(--error);background:var(--error-bg);}
.fx-verdict.unknown{color:var(--text-muted);background:var(--surface-2);}

.fx-signal-list{margin:10px 0 0;padding-left:18px;}
.fx-signal-list li{font-size:12.5px;color:var(--text-muted);margin-bottom:4px;line-height:1.5;}

.fx-compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.fx-compare-col .hd{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--border);}
.fx-compare-col.after .hd{color:var(--violet);border-color:var(--violet-soft);}
@media(max-width:900px){.fx-compare-grid{grid-template-columns:1fr;}}

.fx-goal-card{background:var(--surface-3);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:14px;}
.fx-goal-card .hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px;}
.fx-goal-card h4{font-size:14.5px;font-weight:700;}
.fx-gap-bar-track{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:10px 0 8px;}
.fx-gap-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--violet),var(--gold));}

.fx-section-title{font-size:16.5px;font-weight:700;font-family:var(--font-display);margin:28px 0 14px;padding-top:20px;border-top:1px solid var(--border);}
.fx-section-title:first-child{margin-top:0;padding-top:0;border-top:none;}
.fx-opening{background:linear-gradient(160deg,rgba(109,91,208,.06),var(--surface) 60%);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 24px;margin-bottom:8px;font-size:14.5px;line-height:1.75;}
.fx-opening p{margin-bottom:12px;}
.fx-opening p:last-child{margin-bottom:0;}

/* print layout additions - reuse .report-page / rp-* from the existing report system */
.fx-rp-fund-card{border:1px solid #ddd;border-radius:8px;padding:14px 16px;margin-bottom:14px;page-break-inside:avoid;}
.fx-rp-fund-card h4{font-size:13.5px;margin-bottom:2px;}
.fx-rp-metric-row{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0;font-size:11.5px;}
.fx-rp-metric-row b{font-size:12.5px;}
.fx-help{font-size:12px;color:var(--text-muted);line-height:1.5;margin:8px 0 14px;}
.fx-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px;}
.fx-search{position:relative;min-width:0;}
.fx-label{display:block;font-size:10.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;margin-bottom:4px;}
.fx-scroll{overflow-x:auto;}
.fx-table{width:100%;border-collapse:collapse;margin:10px 0 18px;font-size:11.5px;}
.fx-table th,.fx-table td{padding:8px 9px;text-align:left;border-bottom:1px solid #ddd;vertical-align:top;}
.fx-print-section{break-inside:auto;}
.fx-print-section .fx-section-title{break-after:avoid;}
.fx-print-section .rp-grid{margin-top:10px;}
.fx-print-section .rp-box .row{gap:12px;align-items:flex-start;}
.fx-print-section .rp-box .row b{text-align:right;overflow-wrap:anywhere;}
@media(max-width:900px){.fx-goal-row{grid-template-columns:repeat(2,minmax(0,1fr));}.fx-holding-row{grid-template-columns:minmax(0,1fr);}}
@media print{
  .fx-rp-fund-card,.fx-goal-card,.rp-obs{break-inside:avoid;}
  .fx-rp-fund-card,.fx-goal-card{box-shadow:none;}
  .fx-table thead{display:table-header-group;}
  .fx-table tr{break-inside:avoid;}
}
/* Focus and data views retain the established MF Sarthi visual system. */
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.nav-item:focus-visible{outline:2px solid var(--violet);outline-offset:2px;}
.table-wrap{box-shadow:var(--shadow-sm);}
.ai-hero{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(117deg,#101D3C 0%,#1B2B52 66%,#35426D 100%);padding:32px 38px;border-radius:22px;margin-bottom:20px;color:#fff;box-shadow:0 18px 38px rgba(15,31,64,.13);}
.ai-hero::before{content:'';position:absolute;z-index:-1;width:360px;height:360px;right:-70px;top:-160px;border:1px solid rgba(255,255,255,.12);border-radius:50%;box-shadow:0 0 0 48px rgba(255,255,255,.025),0 0 0 108px rgba(255,255,255,.018);}
.ai-hero::after{content:'';position:absolute;width:6px;height:6px;right:165px;top:48px;border-radius:50%;background:#D9B575;box-shadow:0 0 22px 8px rgba(217,181,117,.22);animation:glowBreathe 5s ease-in-out infinite;}
.ai-hero-badge{display:inline-flex;align-items:center;gap:7px;position:relative;z-index:1;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 11px;margin-bottom:11px;color:#F4DCB2;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
.ai-hero h1{position:relative;z-index:1;color:#fff;font-size:clamp(28px,3vw,38px);letter-spacing:-.04em;line-height:1.1;margin:0 0 9px;}
.ai-hero p{position:relative;z-index:1;color:rgba(255,255,255,.82);font-size:14px;max-width:650px;line-height:1.6;}
.fx-rp-fund-card{background:var(--surface);border:1px solid var(--border);padding:22px 24px;box-shadow:var(--shadow-sm);animation:riseIn .36s ease both;}
.fx-rp-fund-card h4{font-size:16px;line-height:1.35;margin-bottom:5px;}
.fx-kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin:18px 0;}
.fx-kpi-grid>div{background:var(--surface-3);border:1px solid var(--border);border-radius:14px;padding:13px 14px;min-width:0;}
.fx-kpi-grid small,.fx-kpi-grid em{display:block;color:var(--text-muted);font-size:10.5px;font-style:normal;line-height:1.35;}
.fx-kpi-grid b{display:block;color:var(--ink);font-family:var(--font-display);font-size:20px;letter-spacing:-.04em;margin:5px 0;white-space:nowrap;}
.fx-chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:14px 0 20px;}
.fx-fund-heading{display:flex;align-items:start;justify-content:space-between;gap:14px;}
.fx-fund-heading h4{margin-top:4px;}
.fx-nav-tag{white-space:nowrap;border:1px solid var(--border);border-radius:999px;padding:5px 9px;font-size:10px;color:var(--text-muted);background:var(--surface-3);}
.fx-chart,.fx-chart-empty,.fx-peer-chart{background:var(--surface-3);border:1px solid var(--border);border-radius:16px;padding:14px;}
.fx-chart-heading,.fx-chart-foot{display:flex;justify-content:space-between;gap:8px;align-items:center;}
.fx-chart-heading{font-size:11.5px;color:var(--text);margin-bottom:6px;}
.fx-chart-heading span,.fx-chart-foot{color:var(--text-muted);font-size:10.5px;}
.fx-chart svg{width:100%;height:94px;overflow:visible;}
.fx-chart-zero{stroke:var(--border-strong);stroke-width:.5;stroke-dasharray:2 2;}
.fx-chart-line{fill:none;stroke:var(--violet);stroke-width:1.4;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;}
.fx-peer-chart{margin-top:16px;}
.fx-peer-bar-row{display:grid;grid-template-columns:minmax(140px,1.6fr) minmax(80px,2fr) 65px;align-items:center;gap:10px;font-size:10.5px;padding:5px 6px;border-radius:7px;}
.fx-peer-bar-row.selected{background:var(--violet-soft);font-weight:700;}
.fx-peer-bar-row>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fx-peer-bar-row>b{text-align:right;font-variant-numeric:tabular-nums;}
.fx-peer-track{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden;}
.fx-peer-track>div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--violet),var(--gold));}
.fx-import-controls{display:grid;grid-template-columns:minmax(170px,1.5fr) minmax(140px,1fr) auto;gap:10px;align-items:center;margin:16px 0;}
.fx-import-controls input,.fx-cas-item select{width:100%;min-width:0;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);padding:10px;color:var(--text);}
.fx-import-note{background:var(--info-bg);border:1px solid var(--border);border-radius:12px;color:var(--text-muted);padding:10px 14px;font-size:12px;margin:12px 0;}
.fx-import-note p+p{margin-top:6px;}
.fx-cas-list{display:grid;gap:8px;max-height:390px;overflow:auto;}
.fx-cas-item{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--surface-3);}
.fx-cas-item label{font-size:11px;font-weight:700;white-space:nowrap;}
.fx-cas-raw{font-size:11px;color:var(--text-muted);margin-bottom:5px;overflow-wrap:anywhere;}
.fx-coverage{font-size:11px;color:var(--teal);line-height:1.35;margin-top:5px;}
.fx-matrix{border:1px solid var(--border);background:var(--surface);border-radius:18px;margin:23px 0 28px;overflow:hidden;box-shadow:var(--shadow-sm);}
.fx-matrix-head{display:flex;justify-content:space-between;align-items:end;gap:15px;padding:18px 20px 13px;}
.fx-eyebrow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--teal);}
.fx-matrix-head h3{font-size:19px;letter-spacing:-.035em;margin-top:2px;}
.fx-matrix-head>span{font-size:11px;color:var(--text-muted);text-align:right;}
.fx-matrix table{min-width:980px;width:100%;border-collapse:collapse;}
.fx-matrix thead th{background:var(--surface-3);font-size:10px;letter-spacing:.04em;padding:10px 12px;}
.fx-matrix tbody td{font-size:11.5px;padding:13px 12px;white-space:nowrap;}
.fx-matrix tbody td:first-child{min-width:220px;white-space:normal;line-height:1.3;}
.fx-matrix tbody td:first-child small{display:block;color:var(--text-muted);font-size:10px;margin-top:4px;}
.fx-matrix tbody tr{transition:background .18s ease;}
.fx-matrix tbody tr:hover{background:var(--surface-3);}
.fx-missing{color:var(--text-faint);font-size:15px;}
.fx-status{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:700;}
.fx-status.ready{background:var(--success-bg);color:var(--success);}
.fx-status.limited{background:var(--warning-bg);color:var(--warning);}
.fx-matrix-foot{padding:11px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted);}
.fx-data-state{display:flex;align-items:flex-start;gap:14px;border:1px solid var(--border);border-radius:14px;padding:18px;margin:15px 0;background:var(--surface-3);}
.fx-data-state::before{content:'i';display:grid;place-items:center;flex:none;width:25px;height:25px;border-radius:50%;background:var(--info-bg);color:var(--info);font-family:var(--font-display);font-weight:800;}
.fx-data-state strong{font-size:13px;display:block;margin-bottom:4px;}
.fx-data-state p{font-size:12px;color:var(--text-muted);line-height:1.6;}
.crm-aum-bars{display:grid;gap:14px;margin:18px 0 4px;}
.crm-aum-row{display:grid;grid-template-columns:minmax(85px,1fr) minmax(100px,3fr) 85px;align-items:center;gap:12px;font-size:12px;}
.crm-aum-row>span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--text-muted);}
.crm-aum-row>div{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
.crm-aum-row i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--violet),var(--gold));}
.crm-aum-row>b{text-align:right;font-family:var(--font-mono);font-size:11px;}
.crm-overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px;}
.crm-overview button{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:17px;padding:15px 17px;box-shadow:var(--shadow-sm);color:var(--text);transition:transform .25s var(--ease-premium),box-shadow .25s var(--ease-premium);}
.crm-overview button:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
.crm-overview small,.crm-overview span{display:block;color:var(--text-muted);font-size:11px;}
.crm-overview small{font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.crm-overview b{display:block;font-family:var(--font-display);font-size:27px;letter-spacing:-.05em;color:var(--ink);margin:3px 0;}
@media(max-width:900px){.crm-overview{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:1050px){.fx-kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media(max-width:700px){.fx-kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));}.fx-chart-grid,.fx-import-controls{grid-template-columns:1fr;}.fx-rp-fund-card{padding:16px;}.ai-hero{padding:24px;}.fx-peer-bar-row{grid-template-columns:minmax(80px,1fr) minmax(50px,1fr) 55px;gap:5px;}}
@media(prefers-reduced-motion:reduce){.view.active,.picker-dd.open,.picker-dd .pdd-item,.picker-dd .pdd-spinner,.ai-hero::after,.fx-rp-fund-card{animation:none}.nav-item:hover,.btn:hover,.card.card-pad:hover,.picker-dd .pdd-item:hover{transform:none}}
@media print{
  .fx-chart,.fx-peer-chart,.fx-kpi-grid>div,.fx-matrix tr{break-inside:avoid}
  .fx-chart-line{stroke:#5441A3}.fx-peer-track>div{background:#5441A3}
  .fx-matrix .fx-scroll{overflow:visible}
  .fx-matrix table{min-width:0;table-layout:fixed}
  .fx-matrix th,.fx-matrix td{white-space:normal!important;overflow-wrap:anywhere;font-size:8px!important;padding:5px!important}
  .fx-matrix td:first-child{min-width:0!important}
  .fx-matrix th:nth-child(6),.fx-matrix td:nth-child(6),.fx-matrix th:nth-child(7),.fx-matrix td:nth-child(7),.fx-matrix th:nth-child(8),.fx-matrix td:nth-child(8){display:none}
  .fx-rp-fund-card,.ai-hero::after,.picker-dd .pdd-item{animation:none}
}
</style>
</head>

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(1337);
function pick(arr){return arr[Math.floor(rnd()*arr.length)];}
function randInt(min,max){return Math.floor(rnd()*(max-min+1))+min;}
function randFloat(min,max,dec=1){const v=rnd()*(max-min)+min;return +v.toFixed(dec);}
function uid(prefix){return prefix+'_'+Math.random().toString(36).slice(2,9);}

function fmtLakhs(l){
  if(l>=100) return '₹'+(l/100).toFixed(2)+' Cr';
  if(l>=10) return '₹'+l.toFixed(1)+' L';
  return '₹'+l.toFixed(2)+' L';
}
function fmtRupee(n){return '₹'+Math.round(n).toLocaleString('en-IN');}
function fmtRupeeFull(n){return '₹'+Math.round(n).toLocaleString('en-IN');}
function fmtDate(d,opts){
  d = (d instanceof Date)? d : new Date(d);
  return d.toLocaleDateString('en-IN', opts || {day:'numeric',month:'short',year:'numeric'});
}
function fmtDateShort(d){d=(d instanceof Date)?d:new Date(d);return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});}
function fmtTime(h,m){
  const ap = h>=12?'PM':'AM'; let hh = h%12; if(hh===0)hh=12;
  return (hh<10?'0'+hh:hh)+':'+(m<10?'0'+m:m)+' '+ap;
}
function addDays(d,n){const r=new Date(d); r.setDate(r.getDate()+n); return r;}
function sameDay(a,b){return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();}
function initials(name){return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function daysBetween(a,b){return Math.round((b-a)/86400000);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
